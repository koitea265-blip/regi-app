<!DOCTYPE html>
<html lang="ja">
<head>

    <!-- Tailwind CSS (バージョン 3.4.15 に固定) -->
    <script src="https://cdn.tailwindcss.com/3.4.15"></script>
    <!-- Html5-Qrcode (バージョン 2.3.8 に固定) -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Tone.js (バージョン 14.8.49 に固定) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* 基本UI：かわいい丸ゴシック系 */
        body, button, input, p, h1, h2, h3, h4, span {
            font-family: 'M PLUS Rounded 1c', "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
        }

        /* 筆算エリア・レシート：正確なゴシック・丸ゴシックを最優先で適用し、かすれを完全防止 */
        .font-kyokasho, #calculation-grid .graph-cell, [id^="ans-box-"] {
            font-family: 'M PLUS Rounded 1c', "BIZ UDPGothic", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif !important;
        }

        /* カメラの左右反転（鏡）かつ1.8倍デジタルズーム表示（デフォルト適用：インカメラ用） */
        #reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
            transform: scale(-1.8, 1.8) !important; /* 鏡 ＆ 1.8倍拡大 */
            transform-origin: center !important;
            transition: filter 0.3s ease;
        }

        /* 【本質的解決 - CSS詳細度バグの根絶】 */
        /* IDセレクタ「#reader」を結合して「#reader.back-camera video」とすることで、 */
        /* 上記のインカメラ用「#reader video」の優先度に対して、CSS仕様上100%勝利させ、背面カメラ起動時に左右反転を確実に解除します。 */
        #reader.back-camera video {
            transform: scale(1.8, 1.8) !important; /* 鏡なし ＆ 1.8倍ズーム */
        }

        /* 【二重枠対策】ライブラリが動的に自動生成する枠、L字境界、SVG、ボタン、余計なテキストを完全消滅させる */
        #reader__scan_region, 
        #reader svg, 
        #reader span, 
        #reader button {
            display: none !important;
        }

        /* ライブラリ動的生成要素のボーダーやボックスシャドウ、背景色を強制リセット（ビデオトラックのみを生かす） */
        #reader div, 
        #reader td, 
        #reader table {
            border: none !important;
            box-shadow: none !important;
            background: transparent !important;
            background-color: transparent !important;
        }

        /* 方眼罫線 */
        .graph-cell {
            position: relative;
            border-right: 1px solid #bae6fd;
            border-bottom: 1px solid #bae6fd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-select { 
            -webkit-touch-callout: none; 
            user-select: none; 
        }

        /* フラットなリアルレシートのスタイル */
        .receipt-paper {
            position: relative; /* スタンプの配置基準点 */
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-top: 8px solid #10b981; /* 上部のエメラルドカラーの太線 */
        }

        /* 赤い読み取りレーザーの上下ループスイープアニメーション (自製スキャン窓の中だけで動作) */
        @keyframes laser-sweep {
            0% { 
                top: 8%; 
                opacity: 0.4; 
                filter: drop-shadow(0 0 1px rgba(239, 68, 68, 0.7));
            }
            50% { 
                top: 92%; 
                opacity: 1; 
                filter: drop-shadow(0 0 4px rgba(239, 68, 68, 1)) drop-shadow(0 0 8px rgba(239, 68, 68, 0.8));
            }
            100% { 
                top: 8%; 
                opacity: 0.4; 
                filter: drop-shadow(0 0 1px rgba(239, 68, 68, 0.7));
            }
        }

        .scanning-laser {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background-color: #ef4444;
            z-index: 10;
            animation: laser-sweep 2.2s infinite ease-in-out;
            pointer-events: none;
        }
    </style>
</head>

        let canvas, ctx, isDrawing = false, penColor = "#ef4444";

        // 【本質的解決 - 起動時デフォルトカメラはインカメラが優先】

        // FNV-1a 高精度ハッシュアルゴリズム
        function getProductFromBarcode(barcode) {
            let hash = 2166136261;
            for (let i = 0; i < barcode.length; i++) {
                hash = Math.imul(hash ^ barcode.charCodeAt(i), 16777619);
            }
            const baseModulo = 75; 
            const index = Math.abs(hash) % baseModulo;
            return dummyProducts[index % dummyProducts.length];
        }

        // DOMの完全構築を待ち、例外処理を包括して初期化を走らせる防衛コード

        // JS STREAMING_CHUNK: Configuring camera initialization with multi-phase fallback... -->
        async function initScanner() {
            const container = document.getElementById("camera-fallback-msg");
            if (!container) return;

            container.classList.remove("hidden");
            container.innerHTML = `
                <span class="text-4xl mb-3">📷</span>
                <p class="font-bold mb-1">カメラを起動しています...</p>
            `;

            // Html5Qrcode 自体がCDNロードできていないケースをガード
            if (!window.Html5Qrcode) {
                console.error("Html5Qrcode library not loaded yet.");
                showCameraFallback("スキャン用ライブラリが読み込めませんでした。お手数ですがリロードするか、テスト用の「⚡ ぴっ！」ボタンでお遊びください。");
                return;
            }

            try {
                if (html5QrScanner) {
                    try { await html5QrScanner.stop(); } catch (e) {}
                }

                // コンストラクタの初期化（第2引数は verbose フラグのみにする）
                html5QrScanner = new Html5Qrcode("reader", false);
                
                const readerDiv = document.getElementById("reader");
                if (readerDiv) {
                    if (isFrontCamera) {
                        readerDiv.classList.remove("back-camera");
                    } else {
                        readerDiv.classList.add("back-camera");
                    }
                }

                const facingMode = isFrontCamera ? "user" : "environment";

                // 安全弁：グローバル変数がなければライブラリ内からサポートフォーマット定数を探す
                const formats = window.Html5QrcodeSupportedFormats || (window.Html5Qrcode ? Html5Qrcode.SupportedFormats : null);
                
                // 探索するフォーマットを、日本の流通商品で使われる EAN-13, EAN-8, UPC に厳格に制限。
                const formatsConfig = formats ? [
                    formats.EAN_13,
                    formats.EAN_8,
                    formats.UPC_A,
                    formats.UPC_E
                ] : [];

                const scanConfig = {
                    fps: 20, // 処理遅延とコマ落ちを極限まで無くすための最適なリフレッシュレート「20fps」を維持
                    experimentalFeatures: {
                        useBarCodeDetectorIfSupported: true 
                    },
                    formatsToSupport: formatsConfig, // JANに完全に特化した探索空間の制限
                    qrbox: (w, h) => {
                        // 【本質的解決 - ズーム係数を加味したクロップ同期マッピング（視差バグ完全根絶）】
                        // カメラ映像はCSSで「1.8倍」に拡大されており、ユーザーに提示されている白い枠は画面幅の「75%」です。
                        // したがって、オリジナル映像（w, h）に対してスキャン判定枠が切り取るべき正確な物理比率は 0.75 / 1.8 ＝ 約0.416（41.6%）です。
                        // これにより、画面の赤い線の範囲と、デコーダーに送られるスリット画像が完全に同一の座標系として同期され、
                        // 左右のズレ（向かって左に寄せる必要性）は100%消滅し、「中央の赤い線に合わせたら爆速で鳴る」本来の直感操作が確立されます。
                        const scanWidth = Math.round(w * (0.75 / 1.8)); // 画面枠比率(75%)とCSSズーム率(1.8倍)を厳密にマッピング
                        const scanHeight = Math.round(scanWidth * 0.5 / 1.44); // ターゲットガイドのアスペクト比（1.44 : 0.5）に完全同期
                        
                        return { 
                            width: Math.max(scanWidth, 50), 
                            height: Math.max(scanHeight, 50) 
                        };
                    }
                };

                let started = false;
                
                try {
                    // 【本質的解決 1 & 2 - 動的制約設計の完全適用】
                    // 1. facingMode を videoConstraints にも明示的に注入し、ブラウザの解像度優先での勝手なアウトカメラ選択を防ぐ。
                    // 2. 解像度上限の低いインカメラの特性（多くが720p上限）を考慮し、インカメラ起動時のみ 720p（1280x720）を上限に緩めることで
                    //    OverconstrainedErrorによる起動失敗と、それによる望まないアウトカメラへのフォールバックを100%防止。
                    const dynamicConstraints = {
                        facingMode: facingMode,
                        focusMode: "continuous",
                        exposureMode: "continuous"
                    };
                    
                    if (isFrontCamera) {
                        dynamicConstraints.width = { min: 640, ideal: 1280, max: 1280 };
                        dynamicConstraints.height = { min: 480, ideal: 720, max: 720 };
                    } else {
                        dynamicConstraints.width = { min: 640, ideal: 1920, max: 1920 };
                        dynamicConstraints.height = { min: 480, ideal: 1080, max: 1080 };
                    }

                    const highResConfig = { 
                        ...scanConfig,
                        videoConstraints: dynamicConstraints
                    };
                    await html5QrScanner.start({ facingMode: facingMode }, highResConfig, onScanSuccess);
                    started = true;
                } catch (err1) {
                    console.warn("facingMode high-res start failed, trying standard-res fallback:", err1);
                    try {
                        // フェーズ2: 標準画質でのフォールバック
                        const fallbackConstraints = { facingMode: facingMode };
                        const fallbackConfig = { ...scanConfig, videoConstraints: fallbackConstraints };
                        await html5QrScanner.start({ facingMode: facingMode }, fallbackConfig, onScanSuccess);
                        started = true;
                    } catch (err2) {
                        console.warn("facingMode start failed, trying manual camera list fallback:", err2);
                        // 【本質的解決 3 - ラベル走査によるインカメラ100%同定プロトコル】
                        // カメラリスト配列[0]がインカメラであるという盲信を排除。
                        // デバイスから返された label テキストを完全に走査し、インカメラ特有のワードを検出。
                        // 一致する物理デバイスを直接指定して、エラー耐性を持った強硬起動を行います。
                        const cameras = await Html5Qrcode.getCameras();
                        if (cameras && cameras.length > 0) {
                            let targetCamId = cameras[0].id;
                            const searchRegex = isFrontCamera 
                                ? /(front|user|内|正面|サブ|webcam)/i 
                                : /(back|environment|外|背面|メイン|メインカメラ)/i;
                                
                            const matchedCam = cameras.find(cam => searchRegex.test(cam.label));
                            if (matchedCam) {
                                targetCamId = matchedCam.id;
                            } else {
                                // 検出できない場合は歴史的統計に従い、前面＝配列末尾側、背面＝配列先頭側を安全にアテにする
                                targetCamId = isFrontCamera ? cameras[cameras.length - 1].id : cameras[0].id;
                            }
                            
                            await html5QrScanner.start(targetCamId, scanConfig, onScanSuccess);
                            started = true;
                        }
                    }
                }

                if (started) {
                    container.classList.add("hidden");
                    // 起動成功後、オートフォーカスおよび「ハードウェア・デジタルズーム」の適用を試みる
                    try {
                        if (html5QrScanner && typeof html5QrScanner.applyVideoConstraints === 'function') {
                            const capabilities = html5QrScanner.getRunningTrackCapabilities();
                            const constraints = {
                                focusMode: "continuous",
                                advanced: [{ focusMode: "continuous" }]
                            };
                            
                            // 物理レンズがピンボケを起こさない最短撮影距離（15cm程度）を保ったまま、
                            // 小さいバーコードを物理センサーに大きく捉えさせるため、
                            // ハードウェア側がズームに対応していれば、自動的に「2倍デジタルズーム」をカメラモジュールに強制要求します。
                            if (capabilities && capabilities.zoom) {
                                const minZoom = capabilities.zoom.min || 1;
                                const maxZoom = capabilities.zoom.max || 1;
                                const targetZoom = Math.min(2.0, maxZoom); // 2倍、または最大ズーム of 低い方をターゲットにする
                                if (targetZoom >= minZoom) {
                                    constraints.advanced.push({ zoom: targetZoom });
                                }
                            }
                            
                            await html5QrScanner.applyVideoConstraints(constraints);
                        }
                    } catch (e) {
                        console.warn("Camera physical optimization skipped:", e);
                    }
                } else {
                    throw new Error("No camera started.");
                }

            } catch (err) {
                console.error("Camera start process completely failed:", err);
                showCameraFallback('カメラの許可がないか、プレビュー環境（Iframe）によるセキュリティポリシー制限のため、物理カメラが起動できませんでした。<br><span class="text-amber-400 font-bold">でも大丈夫！左下の「⚡ ぴっ！(テスト用)」ボタンを使ってすべてのお買い物・ひっ算・レシート機能を100%体験できます！</span>');
            }
        }

        function showCameraFallback(msg) {
            const container = document.getElementById("camera-fallback-msg");
            if (container) {
                container.classList.remove("hidden");
                container.innerHTML = `
                    <span class="text-4xl mb-3">⚠️</span>

                `;

        }

        let lastScanTime = 0;
        
        function onScanSuccess(code) {
            const now = Date.now();
            
            // 【仕様復元 - 完全なデータバリデーション & 誤読検疫の再適用】
            // 数字のみへの置換、および「8桁, 12桁, 13桁」という日本の商品バーコード限定条件を厳格に復元。
            // アルファベットやノイズを含んだエラー文字列、手ブレで中途半端に切り取られた文字列はすべて破棄されます。
            const cleanCode = code.replace(/[^0-9]/g, ''); 
            if (![8, 12, 13].includes(cleanCode.length)) {
                return; // JAN/UPCの規格外データは一切システムに通さない
            }
            
            // 1.8秒の絶対時間インターバル（チャタリング防止）
            if (now - lastScanTime < 1800) {
                return; 
            }
            
            lastScanTime = now;
            addToCart(getProductFromBarcode(cleanCode));
        }

        // 【本質的解決 - 非同期カメラリソース解放・排他制御プロトコル】
        // カメラ切り替えボタンを押した際、旧レンズのストリームが確実に解放されるよう、
        // awaitによる非同期クローズを同期して待機し、二重起動によるデバイスロックを完全に防止します。
        async function toggleCameraFacing() {
            if (isScannerTransitioning) return; // トランジションが完了するまで次の要求を完全に拒否
            isScannerTransitioning = true;
            
            isFrontCamera = !isFrontCamera;
            
            if (html5QrScanner) {
                try {
                    await html5QrScanner.stop(); // 物理デバイスの解放を100%同期して確実に待機
                } catch(e) {
                    console.warn("Silent ignore scanner stop on toggle:", e);
                }
            }
            
            // 確実に前のカメラデバイスがクローズしたことを保証した上で、200msの時間差をもって安全に初期化
            setTimeout(async () => {
                try {
                    await initScanner();
                } catch(err) {
                    console.error("Camera restart failed during toggle:", err);
                } finally {
                    isScannerTransitioning = false; // 排他制御ロックを解除
                }
            }, 200);
        }

        // JS STREAMING_CHUNK: Defining sound effects and correct/incorrect chimes... -->
        function triggerMockScan() {
            addToCart(dummyProducts[Math.floor(Math.random() * dummyProducts.length)]);
        }

        function addToCart(product) {
            try {
                if (window.Tone && Tone.start) {
                    Tone.start();
                    new Tone.Synth({oscillator:{type:"sine"},envelope:{attack:0.005,decay:0.1}}).toDestination().triggerAttackRelease("D6", "32n");
                }
            } catch(e) {
                console.warn("Audio feedback omitted:", e);
            }

            const scannerContainer = document.getElementById("scanner-container");
            if (scannerContainer) {
                scannerContainer.classList.add("ring-8", "ring-emerald-400");
                setTimeout(() => scannerContainer.classList.remove("ring-8", "ring-emerald-400"), 150);
            }

            cart.push({ ...product, id: Date.now() + Math.random() });
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById("cart-list");
            if (!list) return;

            list.innerHTML = "";
            let total = 0;
            if (cart.length === 0) {
                list.innerHTML = `<li class="text-gray-400 text-center mt-16">おかいもの を はじめよう！</li>`;
            } else {
                cart.forEach(item => {
                    total += item.price;
                    const li = document.createElement("li");
                    li.className = "flex justify-between items-center bg-emerald-50 p-3 rounded-lg border border-emerald-100";
                    li.innerHTML = `
                        <span class="font-bold text-gray-800">${item.name}</span>
                        <div class="flex items-center gap-3">
                            <span class="font-bold text-emerald-700">${item.price} 円</span>
                            <button onclick="removeItem(${item.id})" class="bg-rose-100 text-rose-700 text-xs px-2.5 py-1 rounded-lg font-bold hover:bg-rose-200 transition">とりけす</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            }

            const tc = document.getElementById("total-count");
            const tp = document.getElementById("total-price");
            const btn = document.getElementById("checkout-btn");

            if (tc) tc.innerText = cart.length + " 点";
            if (tp) tp.innerText = total.toLocaleString();
            if (btn) btn.disabled = cart.length === 0;

            setTimeout(() => {
                list.scrollTop = list.scrollHeight;
            }, 50);
        }

        function removeItem(id) { 
            cart = cart.filter(i => i.id !== id); 
            renderCart(); 
        }
        
        function clearCart() { 
            cart = []; 
            renderCart(); 
        }

        function getOptimalPayment(total) {
            const baseThousand = Math.ceil(total / 1000) * 1000;
            if (solvedCount < 1) return baseThousand === total ? baseThousand + 1000 : baseThousand;
            
            const rand = Math.random();
            if (rand < 0.5) {
                const hasu = total % 100;
                if (hasu > 0 && (baseThousand + hasu) > total) {
                    return baseThousand + hasu;
                }
            }
            return (total < 4000 && Math.random() > 0.6) ? 5000 : (baseThousand === total ? baseThousand + 1000 : baseThousand);
        }

        function renderGrid() {
            const cols = paidAmount >= 10000 ? 6 : 5;
            const container = document.getElementById("calculation-grid-container");
            if (!container) return;

            container.innerHTML = `<div id="calculation-grid" class="grid grid-cols-${cols} border-t border-l border-sky-200"></div>`;
            const grid = container.firstChild;

            const paidStr = paidAmount.toString().padStart(cols, " ");
            const totalStr = totalAmount.toString().padStart(cols - 1, " ");

            for(let i=0; i<cols; i++) grid.innerHTML += `<div class="graph-cell h-24 bg-sky-50/30"></div>`; 
            for(let i=0; i<cols; i++) grid.innerHTML += `<div class="graph-cell h-16 text-3xl font-bold font-kyokasho text-slate-800">${paidStr[i] !== " " ? paidStr[i] : ""}</div>`; 
            grid.innerHTML += `<div class="graph-cell h-16 text-5xl font-black text-blue-600 font-kyokasho">－</div>`; 
            for(let i=0; i<cols-1; i++) grid.innerHTML += `<div class="graph-cell h-16 text-3xl font-bold font-kyokasho text-slate-800">${totalStr[i] !== " " ? totalStr[i] : ""}</div>`;
            grid.innerHTML += `<div class="col-span-${cols} h-1.5 bg-slate-800 my-1"></div>`; 
            for(let i=0; i<cols; i++) grid.innerHTML += `<div class="graph-cell h-16 bg-sky-50/10"></div>`; 

            const ansContainer = document.getElementById("answer-grid-container");
            if (!ansContainer) return;

            ansContainer.innerHTML = `<div class="grid grid-cols-${cols} mt-2"><div class="flex items-center justify-center text-2xl font-black text-slate-400">=</div></div>`;
            const ansGrid = ansContainer.firstChild;
            if(cols===6) ansGrid.innerHTML += `<div class="m-1 h-16"></div>`;
            
            for(let i=3; i>=0; i--) ansGrid.innerHTML += `<div onclick="focusDigit(${i})" id="ans-box-${i}" class="m-1 h-16 bg-amber-50 border-2 border-slate-300 rounded-lg flex items-center justify-center text-3xl font-black text-amber-700 transition"></div>`;
            
            userAnswers = ["","","",""]; 
            focusDigit(0);
        }

        function focusDigit(idx) {
            currentFocusIndex = idx;
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-box-${i}`);
                if(b) b.className = (i===idx) ? "m-1 h-16 bg-yellow-100 border-4 border-amber-400 rounded-lg flex items-center justify-center text-3xl font-black text-amber-800 scale-105" : "m-1 h-16 bg-amber-50 border-2 border-slate-300 rounded-lg flex items-center justify-center text-3xl font-black text-amber-700";
            }
        }

        /* JS STREAMING_CHUNK: Handling touch inputs on grid arithmetic... */
        function pressKey(k) {
            if (isSolved) return; 
            
            if(typeof k === 'number') {
                userAnswers[currentFocusIndex] = k.toString();
                const b = document.getElementById(`ans-box-${currentFocusIndex}`);
                if (b) b.innerText = k;
                if(currentFocusIndex < 3) focusDigit(currentFocusIndex + 1);
            } else if(k === 'BS') {
                userAnswers[currentFocusIndex] = ""; 
                const b = document.getElementById(`ans-box-${currentFocusIndex}`);
                if (b) b.innerText = "";
                if(currentFocusIndex > 0) focusDigit(currentFocusIndex - 1);
            } else if(k === 'C') {
                userAnswers = ["","","",""]; 
                for(let i=0; i<4; i++) { 
                    const b = document.getElementById(`ans-box-${i}`); 
                    if(b) b.innerText = ""; 
                } 
                focusDigit(0);
            }
        }

        function playIncorrectChime() {
            try {
                if (window.Tone && Tone.start) {
                    Tone.start();
                    const synthChime = new Tone.PolySynth().toDestination();
                    synthChime.set({ oscillator: { type: "sawtooth" } });
                    const now = Tone.now();
                    synthChime.triggerAttackRelease(["F#2", "G2"], "16n", now);
                    synthChime.triggerAttackRelease(["F#2", "G2"], "6n", now + 0.12);
                }
            } catch(e) {
                console.warn("Incorrect chime error ignored:", e);
            }
        }

        function checkAnswer() {
            if (isSolved) return;
            
            let s = ""; 
            for(let i=3; i>=0; i--) s += userAnswers[i] || (s===""?"":"0");
            
            if(parseInt(s || "0") === changeAmount) {
                isSolved = true;
                playCorrectChime();
                solvedCount++; 
                showReceiptButton();
            } else {
                playIncorrectChime();
            }
        }

        function showAnswerAutomatic() {
            if (isSolved) return;
            isSolved = true;
            
            const strChange = changeAmount.toString();
            userAnswers = ["", "", "", ""];
            
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-box-${i}`);
                if(b) b.innerText = "";
            }

            let strIdx = strChange.length - 1;
            for(let i=0; i<strChange.length; i++) {
                userAnswers[i] = strChange[strIdx - i];
                const b = document.getElementById(`ans-box-${i}`);
                if (b) {
                    b.innerText = userAnswers[i];
                }
            }
            
            currentFocusIndex = -1;
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-box-${i}`);
                if (b && !userAnswers[i]) {
                    b.className = "m-1 h-16 bg-amber-50 border-2 border-slate-300 rounded-lg flex items-center justify-center text-3xl font-black text-amber-700";
                }
            }

            playCorrectChime();
            showReceiptButton();
        }

        function showReceiptButton() {
            const row = document.getElementById("action-buttons-row");
            const btn = document.getElementById("show-receipt-btn");
            if (row) row.className = "hidden";
            if (btn) btn.className = "w-full bg-emerald-500 text-white font-black py-4 rounded-xl text-xl shadow-lg hover:bg-emerald-600 animate-pulse";
            
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-box-${i}`);
                if (b && userAnswers[i]) {
                    b.classList.remove("bg-yellow-100", "border-amber-400", "text-amber-800", "bg-amber-50", "text-amber-700", "border-slate-300");
                    b.classList.add("bg-sky-100", "border-4", "border-sky-400", "text-sky-800", "scale-105"); 
                }
            }
        }

        // JS STREAMING_CHUNK: Implementing digital memo canvas paint system... -->
        function showReceipt() {
            document.getElementById("payment-modal").classList.add("hidden");
            
            const d = new Date(); 
            const dateEl = document.getElementById("receipt-date");
            const txEl = document.getElementById("receipt-tx-no");
            
            if (dateEl) dateEl.innerText = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
            if (txEl) txEl.innerText = Math.floor(Math.random() * 9000) + 1000;
            
            const list = document.getElementById("receipt-items-list"); 
            if (list) {
                list.innerHTML = "";
                cart.forEach(i => {
                    list.innerHTML += `
                        <div class="flex justify-between text-black font-bold">
                            <span>${i.name}</span>
                            <span>${i.price} 円</span>
                        </div>`;
                });
            }
            
            const rcTotal = document.getElementById("receipt-total-cost");
            const rcPaid = document.getElementById("receipt-paid-amount");
            const rcChange = document.getElementById("receipt-change-amount");

            if (rcTotal) rcTotal.innerText = totalAmount.toLocaleString();
            if (rcPaid) rcPaid.innerText = paidAmount.toLocaleString();
            if (rcChange) rcChange.innerText = changeAmount.toLocaleString();
            
            document.getElementById("success-modal").classList.remove("hidden");
        }

        function playCorrectChime() {
            try {
                if (window.Tone && Tone.start) {
                    Tone.start();
                    const synthChime = new Tone.PolySynth().toDestination();
                    const now = Tone.now();
                    synthChime.triggerAttackRelease("C5", "8n", now);
                    synthChime.triggerAttackRelease("E5", "8n", now + 0.1);
                    synthChime.triggerAttackRelease("G5", "8n", now + 0.2);
                    synthChime.triggerAttackRelease("C6", "4n", now + 0.3);
                }
            } catch(e) {
                console.warn("Correct chime error ignored:", e);
            }
        }

        function setupMemoCanvas() {
            canvas = document.getElementById("memo-canvas"); 
            if (!canvas) return;
            ctx = canvas.getContext("2d");
            
            const draw = (e) => {
                if(!isDrawing || !ctx) return;
                const r = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                ctx.lineTo(x, y); 
                ctx.strokeStyle = penColor; 
                ctx.lineWidth = 4; 
                ctx.lineCap = "round"; 
                ctx.stroke();
            };
            
            canvas.onmousedown = (e) => { 
                if (!ctx) return;
                isDrawing = true; 
                ctx.beginPath(); 
                const r = canvas.getBoundingClientRect(); 
                ctx.moveTo(e.clientX-r.left, e.clientY-r.top); 
            };
            canvas.onmousemove = draw;
            window.onmouseup = () => isDrawing = false;
            
            canvas.addEventListener("touchstart", (e) => { 
                if (!ctx) return;
                isDrawing = true; 
                ctx.beginPath(); 
                const r = canvas.getBoundingClientRect(); 
                ctx.moveTo(e.touches[0].clientX-r.left, e.touches[0].clientY-r.top); 
                e.preventDefault(); 
            }, { passive: false });
            
            canvas.addEventListener("touchmove", (e) => { 
                draw(e); 
                e.preventDefault(); 
            }, { passive: false });

            canvas.addEventListener("touchend", () => {
                isDrawing = false;
            });
        }
        
        function resizeCanvas() { 
            const c = document.getElementById("canvas-container"); 
            if (c && canvas && c.offsetWidth > 0 && c.offsetHeight > 0) {
                canvas.width = c.offsetWidth; 
                canvas.height = c.offsetHeight; 
            } else {
                setTimeout(resizeCanvas, 50);
            }
        }
    </script>
