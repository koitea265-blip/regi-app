<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>セルフレジでおかいけいしよう</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 業界標準バーコード解析エンジン ZXing -->
    <script src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
    <!-- Tone.js (Web Audio API音響効果) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts 丸ゴシック体 -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body, button, input, p, h1, h2, h3, h4 {
            font-family: 'M PLUS Rounded 1c', "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
        }

        .font-kyokasho {
            font-family: "UD Digi Kyokasho NK-R", "UD デジタル教科書体 NK-R", "UD Digi Kyokasho NP-R", "UD デジタル教科書体 NP-R", "UD デジタル教科書体", "游教科書体", "YuMincho", "Yu Mincho", "Hiragino Mincho ProN", serif !important;
        }

        #scanner-viewport {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            border-radius: 0.5rem;
        }

        /* 20cm離した位置で等倍・クッキリ映る鏡像表示 */
        .mirror-mode {
            transform: scaleX(-1);
            transform-origin: center center;
        }

        #video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.5rem;
        }

        @keyframes laser-sweep {
            0% { top: 10%; opacity: 0.8; }
            50% { top: 90%; opacity: 1; box-shadow: 0 0 14px #10b981; }
            100% { top: 10%; opacity: 0.8; }
        }

        .scanning-laser {
            position: absolute;
            left: 2%;
            right: 2%;
            height: 3px;
            background-color: #10b981;
            z-index: 10;
            animation: laser-sweep 1.2s infinite ease-in-out;
        }

        .graph-cell {
            position: relative;
            border-right: 1px solid #bae6fd;
            border-bottom: 1px solid #bae6fd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-select { 
            -webkit-touch-callout: none; 
            user-select: none; 
        }

        #cart-list-container {
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
            max-height: 100%;
        }
        
        .receipt-paper {
            position: relative; 
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-top: 8px solid #10b981; 
        }
    </style>
</head>
<body class="h-screen flex flex-col bg-slate-50 overflow-hidden no-select">

    <header class="bg-emerald-600 text-white p-3 sm:p-4 shadow-md flex justify-between items-center z-10 flex-shrink-0">
        <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">🛒 セルフレジでおかいけいしよう</h1>
        <span class="bg-emerald-800 text-xs px-3 py-1.5 rounded-full font-bold hidden sm:inline">たのしいお買い物＆ひっ算おつり計算</span>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row p-2 sm:p-4 gap-2 sm:gap-4 overflow-hidden min-h-0">
        
        <!-- 左側：カメラゾーン -->
        <section class="w-full lg:flex-1 bg-white rounded-xl shadow-lg flex flex-col p-3 sm:p-4 border border-emerald-100 flex-shrink-0" style="height: 52vh; min-height: 340px;">
            <div class="flex justify-between items-center mb-1.5">
                <h2 class="text-base sm:text-lg font-bold text-gray-700 flex items-center gap-1.5">
                    <span>📸</span> バーコードをスキャンしよう！
                </h2>
                <div id="scanner-status" class="text-[11px] sm:text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>高感度スキャン稼働中</span>
                </div>
            </div>
            
            <div class="relative w-full flex-1 bg-black rounded-lg overflow-hidden flex flex-col items-center justify-center border-2 border-slate-700">
                <div id="scanner-container" class="absolute inset-0 w-full h-full flex items-center justify-center">
                    
                    <div id="scanner-viewport">
                        <video id="video-element" class="mirror-mode" playsinline autoplay muted></video>
                    </div>
                    
                    <!-- 20cm離した位置でピッタリ収まる広めガイド枠 -->
                    <div class="absolute inset-0 z-10 pointer-events-none flex items-center justify-center">
                        <div id="scan-guide" class="relative border-2 border-emerald-400 rounded-lg shadow-[0_0_0_9999px_rgba(0,0,0,0.12)] flex items-center justify-center" style="width: 65%; aspect-ratio: 5/2.2; max-width: 290px; min-width: 170px;">
                            <div class="absolute -top-7 text-white text-[11px] bg-emerald-600/90 px-2.5 py-0.5 rounded-full font-bold whitespace-nowrap shadow">
                                📏 20cmはなして枠にあわせてね
                            </div>
                            <div class="absolute top-0 left-0 w-4 h-4 border-t-4 border-l-4 border-emerald-300 rounded-tl-sm"></div>
                            <div class="absolute top-0 right-0 w-4 h-4 border-t-4 border-r-4 border-emerald-300 rounded-tr-sm"></div>
                            <div class="absolute bottom-0 left-0 w-4 h-4 border-b-4 border-l-4 border-emerald-300 rounded-bl-sm"></div>
                            <div class="absolute bottom-0 right-0 w-4 h-4 border-b-4 border-r-4 border-emerald-300 rounded-br-sm"></div>
                            <div id="laser-line" class="scanning-laser"></div>
                        </div>
                    </div>
                    
                    <div id="camera-fallback-msg" class="absolute inset-0 bg-slate-900 text-white flex flex-col items-center justify-center p-4 text-center z-20 pointer-events-none">
                        <span class="text-4xl mb-2">📷</span>
                        <p class="font-bold text-sm">カメラを起動中...</p>
                    </div>
                </div>
            </div>

            <div class="mt-2.5 flex gap-2 justify-between items-center flex-shrink-0">
                <button onclick="triggerMockScan()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-3 sm:px-4 rounded-lg shadow active:scale-95 transition text-xs sm:text-sm flex items-center gap-1">
                    ⚡ ぴっ！(テスト用)
                </button>
                <div class="flex gap-1.5">
                    <button id="toggle-camera-btn" onclick="toggleCameraFacing()" class="bg-slate-600 hover:bg-slate-700 text-white font-bold py-2 px-3 text-xs sm:text-sm rounded-lg active:scale-95 transition flex items-center gap-1">
                        📷 カメラ切替
                    </button>
                    <button onclick="clearCart()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-3 text-xs sm:text-sm rounded-lg active:scale-95 transition">
                        からにする
                    </button>
                </div>
            </div>
        </section>

        <!-- 右側：買い物かごゾーン -->
        <section class="flex-1 bg-white rounded-xl shadow-lg flex flex-col p-3 sm:p-4 min-h-0 border border-emerald-100">
            <h2 class="text-lg sm:text-xl font-bold mb-2 text-gray-700 border-b-2 border-gray-100 pb-2 flex items-center gap-1.5 flex-shrink-0">
                <span>📋</span> おかいあげ商品
            </h2>
            
            <div id="cart-list-container" class="flex-1 overflow-y-auto mb-3 pr-1">
                <ul id="cart-list" class="space-y-2 pb-2">
                    <li id="cart-placeholder" class="text-gray-400 text-center mt-10 font-kyokasho text-sm sm:text-base">おかいもの を はじめよう！</li>
                </ul>
            </div>

            <div class="bg-slate-50 p-3 sm:p-4 rounded-xl border border-slate-200 flex-shrink-0">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm sm:text-lg font-bold text-gray-600">お買い上げ点数:</span>
                    <span id="total-count" class="text-lg sm:text-xl font-bold">0 点</span>
                </div>
                <div class="flex justify-between items-center mb-3">
                    <span class="text-sm sm:text-lg font-bold text-gray-600">ごうけい金額:</span>
                    <span class="text-2xl sm:text-3xl font-black text-rose-600"><span id="total-price">0</span> 円</span>
                </div>
                <button id="checkout-btn" onclick="openPaymentModal()" disabled class="w-full bg-emerald-500 text-white font-black py-3 sm:py-4 rounded-xl text-lg sm:text-xl shadow-lg hover:bg-emerald-600 active:scale-95 transition disabled:bg-slate-300">
                    💳 おかいけいする
                </button>
            </div>
        </section>
    </main>

    <!-- お支払い・筆算計算モーダル -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-2 sm:p-4">
        <div class="bg-sky-50 rounded-2xl shadow-2xl max-w-4xl w-full flex flex-col overflow-hidden border-4 border-sky-400 h-[95vh] md:h-auto max-h-[900px]">
            <div class="bg-sky-500 text-white p-3 text-center shrink-0">
                <h3 class="text-xl sm:text-2xl font-bold">おつりを けいさん しよう！</h3>
                <p id="payment-info" class="text-sm sm:text-lg mt-1 font-semibold"></p>
            </div>

            <div class="flex-1 flex flex-col md:flex-row p-3 gap-4 overflow-y-auto">
                <div class="flex flex-col gap-2 w-full max-w-[340px] mx-auto shrink-0">
                    <div class="relative w-full flex items-center justify-between bg-white px-3 py-1.5 rounded-lg shadow-sm border border-sky-100">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-500 font-bold">✍️ メモ:</span>
                            <button onclick="setPenColor('#ef4444')" id="btn-pen-red" class="w-6 h-6 rounded-full bg-red-500 border-2 border-white ring-2 ring-red-500"></button>
                            <button onclick="setPenColor('#3b82f6')" id="btn-pen-blue" class="w-6 h-6 rounded-full bg-blue-500 border-2 border-white"></button>
                            <button onclick="setPenColor('#1e293b')" id="btn-pen-black" class="w-6 h-6 rounded-full bg-slate-800 border-2 border-white"></button>
                        </div>
                        <button onclick="clearCanvas()" class="text-xs bg-amber-100 text-amber-800 font-bold py-1 px-2.5 rounded hover:bg-amber-200">🧹 消す</button>
                    </div>

                    <div class="relative w-full bg-white rounded-xl shadow-lg border-2 border-sky-300 p-2 overflow-hidden">
                        <div class="relative w-full" id="canvas-container">
                            <div id="calculation-grid-container"></div>
                            <canvas id="memo-canvas" class="absolute top-0 left-0 w-full h-full cursor-crosshair z-20 touch-none"></canvas>
                        </div>
                        <div id="answer-grid-container"></div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col justify-center items-center max-w-sm mx-auto w-full shrink-0">
                    <div class="grid grid-cols-3 gap-2 w-full font-kyokasho">
                        <button onclick="pressKey(7)" class="bg-white p-3 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">7</button>
                        <button onclick="pressKey(8)" class="bg-white p-3 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">8</button>
                        <button onclick="pressKey(9)" class="bg-white p-3 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">9</button>
                        <button onclick="pressKey(4)" class="bg-white p-3 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">4</button>
                        <button onclick="pressKey(5)" class="bg-white p-3 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">5</button>
                        <button onclick="pressKey(6)" class="bg-white p-3 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">6</button>
                        <button onclick="pressKey(1)" class="bg-white p-3 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">1</button>
                        <button onclick="pressKey(2)" class="bg-white p-3 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">2</button>
                        <button onclick="pressKey(3)" class="bg-white p-3 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">3</button>
                        <button onclick="pressKey('C')" class="bg-rose-100 p-3 sm:p-5 rounded-2xl text-base sm:text-xl font-bold active:scale-95 transition">消す</button>
                        <button onclick="pressKey(0)" class="bg-white p-3 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">0</button>
                        <button onclick="pressKey('BS')" class="bg-amber-100 p-3 sm:p-5 rounded-2xl text-base sm:text-xl font-bold active:scale-95 transition">⬅戻る</button>
                    </div>
                    
                    <div class="mt-4 w-full flex flex-col gap-2">
                        <div class="flex gap-2 w-full" id="action-buttons-row">
                            <button onclick="closePaymentModal()" class="flex-1 bg-slate-400 text-white font-bold py-3 rounded-xl hover:bg-slate-500 text-sm active:scale-95 transition">やめる</button>
                            <button onclick="showAnswerAutomatic()" class="flex-1 bg-sky-500 text-white font-bold py-3 rounded-xl hover:bg-sky-600 text-sm active:scale-95 transition">💡答え</button>
                            <button onclick="checkAnswer()" class="flex-1 bg-amber-500 text-white font-black py-3 rounded-xl hover:bg-amber-600 text-sm shadow-md active:scale-95 transition">答え合わせ</button>
                        </div>
                        <button id="show-receipt-btn" onclick="showReceipt()" class="hidden w-full bg-emerald-500 text-white font-black py-4 rounded-xl text-xl shadow-lg hover:bg-emerald-600 animate-pulse">
                            🧾 レシートをみる！
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- レシートモーダル -->
    <div id="success-modal" class="hidden fixed inset-0 bg-slate-950/80 z-50 overflow-y-auto flex justify-center items-start py-8 px-4">
        <div class="flex flex-col items-center max-w-sm w-full mt-4">
            <div class="receipt-paper w-full bg-white text-black p-6 font-bold text-sm">
                <div class="absolute top-4 right-4 border-4 border-rose-600 text-rose-600 text-xs font-black px-2 py-1 rounded-lg rotate-12 bg-white/95 shadow-sm z-10">💮 よくできました</div>
                <div class="text-center mb-4 mt-2 pr-20 relative">
                    <div class="text-lg font-black text-black font-kyokasho">🌻 さくらマーケット</div>
                    <div class="text-[11px] text-slate-900 font-bold">おつり計算 セルフレジ</div>
                </div>
                <div class="border-b border-dashed border-slate-500 my-2"></div>
                
                <div class="flex justify-between text-[11px] text-slate-900 px-1 font-bold">
                    <span id="receipt-date"></span>
                    <span>レジ: 001</span>
                </div>
                <div class="flex justify-between text-[11px] text-slate-900 px-1 mt-0.5 font-bold">
                    <span>担 当: 店長</span>
                    <span>取引No. <span id="receipt-tx-no"></span></span>
                </div>

                <div class="border-b border-dashed border-slate-500 my-2"></div>
                <ul id="receipt-items-list" class="space-y-1 my-3 text-xs text-black font-bold"></ul>
                <div class="border-b border-dashed border-slate-500 my-2"></div>
                
                <div class="space-y-2 font-black mt-2 text-black text-base">
                    <div class="flex justify-between text-base border-b border-slate-500 pb-1">
                        <span>合計（内税）</span>
                        <span><span id="receipt-total-cost">0</span> 円</span>
                    </div>
                    <div class="flex justify-between pt-1 text-base font-black text-black">
                        <span>おあずかり</span>
                        <span><span id="receipt-paid-amount">0</span> 円</span>
                    </div>
                    <div class="flex justify-between text-base border-t border-slate-500 pt-1 mt-1 font-black text-black">
                        <span>おつり</span>
                        <span><span id="receipt-change-amount">0</span> 円</span>
                    </div>
                </div>

                <div class="flex justify-center items-center gap-0.5 mt-6 mb-2 h-8 opacity-90">
                    <div class="w-1 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div><div class="w-1 h-full bg-slate-950"></div>
                    <div class="w-3 h-full bg-slate-950"></div><div class="w-1 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div>
                </div>
                <div class="text-center text-[11px] text-slate-900 font-bold">
                    <p>ありがとうございました！</p>
                </div>
            </div>
            <button onclick="resetAppAndCloseSuccess()" class="w-full mt-6 bg-amber-500 hover:bg-amber-600 text-white font-black py-4 rounded-xl text-xl shadow-lg transition active:scale-95">つぎのお買い物へ！</button>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        const dummyProducts = [
            { name: "りんご (🍎)", price: 124 }, { name: "みかん (🍊)", price: 87 },
            { name: "バナナ (🍌)", price: 158 }, { name: "いちご (🍓)", price: 398 },

            { name: "チョコドーナツ (🍩)", price: 154 }, { name: "チーズバーガー (🍔)", price: 392 },
            { name: "タコ焼きパック (🐙)", price: 415 }, { name: "ビーフカレー (🍛)", price: 624 },
            { name: "ポテトチップス (🥔)", price: 119 }, { name: "フルーツグミ (🍬)", price: 122 },

            { name: "ぷくぷくシール (🐟)", price: 112 }, { name: "らいおんバッジ (🦁)", price: 183 },
            { name: "ねこペンケース (✏️)", price: 594 }, { name: "キャラクターかさ (☂️)", price: 783 },

            { name: "バドミントンシャトル (🏸)", price: 184 }
        ];

        let cart = [];
        let codeReader = null;
        let selectedDeviceId = null;
        let videoDevices = [];
        let isScannerRunning = false;
        
        /* クールダウンタイマー＆厳格ロック */
        let isCooldown = false;
        let cooldownTimer = null;
        
        let solvedCount = 0; 
        let isSolved = false;
        let synth = null;
        let totalAmount = 0, paidAmount = 0, changeAmount = 0;
        let currentFocusIndex = 0;
        let userAnswers = ["", "", "", ""];

        /* バーコードと商品の決定論的一意マッピング */
        const barcodeProductMap = new Map();

        function initAudio() {
            if (!synth) {
                synth = new Tone.Synth({oscillator:{type:"sine"},envelope:{attack:0.005,decay:0.1}}).toDestination();
            }
            if (Tone.context.state !== 'running') Tone.context.resume();
        }

        function updateScannerStatus(message, isSuccess = false, isLocked = false) {
            const el = document.getElementById("scanner-status");
            if (!el) return;
            if (isSuccess) {
                el.className = "text-[11px] sm:text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 flex items-center gap-1";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500"></span><span>${message}</span>`;
            } else if (isLocked) {
                el.className = "text-[11px] sm:text-xs font-bold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 flex items-center gap-1";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span>${message}</span>`;
            } else {
                el.className = "text-[11px] sm:text-xs font-bold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-800 flex items-center gap-1";
                el.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span><span>${message}</span>`;
            }
        }

        /* モジュラス10 Check Digit 判定 */
        function isValidJanCheckDigit(code) {
            if (!code || typeof code !== 'string') return false;
            const digits = code.replace(/[^0-9]/g, '');
            if (digits.length !== 13 && digits.length !== 8) return false;

            let sum = 0;
            const len = digits.length;
            const checkDigit = parseInt(digits[len - 1], 10);

            for (let i = 0; i < len - 1; i++) {
                const digit = parseInt(digits[i], 10);
                if (len === 13) {
                    sum += (i % 2 === 0) ? digit * 1 : digit * 3;
                } else {
                    sum += (i % 2 === 0) ? digit * 3 : digit * 1;
                }
            }

            const calcCheck = (10 - (sum % 10)) % 10;
            return calcCheck === checkDigit;
        }

        /* 100%一意商品マッピング */
        function getProductFromBarcode(barcode) {
            if (!barcode) return dummyProducts[0];
            const digits = barcode.toString().trim().replace(/[^0-9]/g, '');
            if (!digits) return dummyProducts[0];

            if (barcodeProductMap.has(digits)) {
                return barcodeProductMap.get(digits);
            }

            let hash = 2166136261;
            for (let i = 0; i < digits.length; i++) {
                hash ^= digits.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            let baseIndex = Math.abs(hash) % dummyProducts.length;

            let index = baseIndex;
            let attempts = 0;
            const usedProductIndices = new Set(Array.from(barcodeProductMap.values()).map(p => dummyProducts.indexOf(p)));
            
            while (usedProductIndices.has(index) && attempts < dummyProducts.length) {
                index = (index + 1) % dummyProducts.length;
                attempts++;
            }

            const product = dummyProducts[index];
            barcodeProductMap.set(digits, product);
            return product;
        }

        window.addEventListener("DOMContentLoaded", () => {
            renderCart();
            setupMemoCanvas();
            setTimeout(() => { startZXingScanner(); }, 300);
        });

        async function stopZXingScanner() {
            if (codeReader) {
                try { codeReader.reset(); } catch(e){}
            }
            const videoEl = document.getElementById("video-element");
            if (videoEl && videoEl.srcObject) {
                try {
                    const tracks = videoEl.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                    videoEl.srcObject = null;
                } catch(e) {}
            }
            isScannerRunning = false;
            updateScannerStatus("カメラ停止");
            // ブラウザのリソース完全解放のため短いウェイティング
            await new Promise(r => setTimeout(r, 250));
        }

        async function startZXingScanner() {
            await stopZXingScanner();

            const fallbackMsg = document.getElementById("camera-fallback-msg");
            fallbackMsg.classList.remove("hidden");
            updateScannerStatus("スキャン準備中");

            try {
                if (typeof ZXing === 'undefined') {
                    throw new Error("ZXing library is not loaded");
                }

                const hints = new Map();
                const formats = [
                    ZXing.BarcodeFormat.EAN_13,
                    ZXing.BarcodeFormat.EAN_8,
                    ZXing.BarcodeFormat.UPC_A
                ];
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

                codeReader = new ZXing.BrowserMultiFormatReader(hints, 120);

                try {
                    videoDevices = await codeReader.listVideoInputDevices();
                } catch(e) {
                    videoDevices = [];
                }

                if (videoDevices && videoDevices.length > 0 && !selectedDeviceId) {
                    const rearCam = videoDevices.find(d => 
                        d.label.toLowerCase().includes('back') || 
                        d.label.toLowerCase().includes('rear') || 
                        d.label.toLowerCase().includes('environment') ||
                        d.label.toLowerCase().includes('背面') ||
                        d.label.toLowerCase().includes('アウト')
                    );
                    selectedDeviceId = rearCam ? rearCam.deviceId : videoDevices[0].deviceId;
                }

                isScannerRunning = true;
                fallbackMsg.classList.add("hidden");
                updateScannerStatus("高感度スキャン中");

                try {
                    await codeReader.decodeFromVideoDevice(
                        selectedDeviceId || null,
                        'video-element',
                        (result, err) => {
                            if (result && isScannerRunning && !isCooldown) {
                                const codeText = result.getText();
                                if (codeText) {
                                    onZXingDetected(codeText);
                                }
                            }
                        }
                    );
                } catch (streamErr) {
                    console.warn("指定カメラでの起動エラー、デフォルトカメラへフォールバック:", streamErr);
                    await codeReader.decodeFromVideoDevice(
                        null,
                        'video-element',
                        (result, err) => {
                            if (result && isScannerRunning && !isCooldown) {
                                const codeText = result.getText();
                                if (codeText) {
                                    onZXingDetected(codeText);
                                }
                            }
                        }
                    );
                }

            } catch (err) {
                console.error("スキャナー起動エラー:", err);
                showCameraErrorMsg(err.message || "カメラの起動に失敗しました。他のアプリでカメラが使用中でないかご確認ください。");
            }
        }

        function onZXingDetected(code) {
            if (isCooldown) return;

            if (!code || typeof code !== 'string') return;
            const cleanCode = code.trim().replace(/[^0-9]/g, '');
            if (cleanCode.length < 5) return;

            /* チェックデジット判定 */
            if (!isValidJanCheckDigit(cleanCode)) return;

            isCooldown = true;
            
            const product = getProductFromBarcode(cleanCode);
            updateScannerStatus(`✅ 登録完了: ${product.name.split(' ')[0]}`, true);
            addToCart(product);

            if (cooldownTimer) clearTimeout(cooldownTimer);
            cooldownTimer = setTimeout(() => {
                isCooldown = false;
                if (isScannerRunning) {
                    updateScannerStatus("高感度スキャン中");
                }
            }, 1500);
        }

        function showCameraErrorMsg(msg) {
            const fallbackMsg = document.getElementById("camera-fallback-msg");
            fallbackMsg.classList.remove("hidden");
            fallbackMsg.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center p-4 w-full h-full bg-slate-900/95 absolute inset-0 z-20 pointer-events-auto">
                    <span class="text-4xl mb-2">📷</span>
                    <p class="font-bold text-rose-400 mb-4 text-xs sm:text-sm">${msg}</p>
                    <button onclick="startZXingScanner()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-5 rounded-xl shadow active:scale-95 transition text-xs sm:text-sm">
                        再起動する
                    </button>
                </div>
            `;
            updateScannerStatus("カメラ停止中");
        }

        async function toggleCameraFacing() {
            await stopZXingScanner();
            if (videoDevices && videoDevices.length > 1) {
                const currentIdx = videoDevices.findIndex(d => d.deviceId === selectedDeviceId);
                const nextIdx = (currentIdx + 1) % videoDevices.length;
                selectedDeviceId = videoDevices[nextIdx].deviceId;
            } else {
                selectedDeviceId = null;
            }
            await startZXingScanner();
        }

        function triggerMockScan() {
            const product = dummyProducts[Math.floor(Math.random() * dummyProducts.length)];
            updateScannerStatus(`✅ 登録完了: ${product.name.split(' ')[0]}`, true);
            addToCart(product);
        }

        function addToCart(product) {
            initAudio();
            if (synth) synth.triggerAttackRelease("D6", "32n");

            const container = document.getElementById("scanner-container");
            container.classList.add("ring-8", "ring-emerald-400");
            setTimeout(() => container.classList.remove("ring-8", "ring-emerald-400"), 200);

            cart.push({ ...product, id: Date.now() + Math.random() });
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById("cart-list");
            const container = document.getElementById("cart-list-container");
            list.innerHTML = "";
            let total = 0;
            
            if (cart.length === 0) {
                list.innerHTML = `<li id="cart-placeholder" class="text-gray-400 text-center mt-10 font-kyokasho text-sm sm:text-base">おかいもの を はじめよう！</li>`;
            } else {
                cart.forEach(item => {
                    total += item.price;
                    const li = document.createElement("li");
                    li.className = "flex justify-between items-center bg-emerald-50 p-2.5 sm:p-3 rounded-lg border border-emerald-100";
                    li.innerHTML = `
                        <span class="font-bold text-gray-800 text-sm sm:text-base font-kyokasho">${item.name}</span>
                        <div class="flex items-center gap-2 sm:gap-3">
                            <span class="font-bold text-emerald-700 text-sm sm:text-base font-kyokasho">${item.price} 円</span>
                            <button onclick="removeItem(${item.id})" class="bg-rose-100 text-rose-700 text-xs px-2.5 py-1 rounded-lg font-bold hover:bg-rose-200 active:scale-95 transition">取消</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            }

            document.getElementById("total-count").innerText = cart.length + " 点";
            document.getElementById("total-price").innerText = total.toLocaleString();
            document.getElementById("checkout-btn").disabled = cart.length === 0;

            setTimeout(() => { 
                container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' }); 
            }, 50);
        }

        function removeItem(id) { cart = cart.filter(i => i.id !== id); renderCart(); }
        function clearCart() { cart = []; renderCart(); }

        /* お支払い金額選出ロジック（基本: 80%, 端数合わせ: 15%, 大きなお金: 5%） */
        function getOptimalPayment(total) {
            // 基本の千円札切り上げ（例: 2231円 -> 3000円、824円 -> 1000円）
            const thousandBase = (total % 1000 === 0) ? total + 1000 : Math.ceil(total / 1000) * 1000;
            
            const rand = Math.random();

            // 1. 大きなお金（5% ＝ 20回に1回程度）
            if (rand < 0.05) {
                if (total < 4500) return 5000;
                if (total < 9500) return 10000;
                return thousandBase + 2000;
            }

            // 2. 端数合わせ（15% ＝ 約6〜7回に1回程度）
            if (rand < 0.20) { // 0.05 <= rand < 0.20
                const hasu100 = total % 100;
                const hasu10 = total % 10;
                let candidates = [];

                // 下2桁端数出し（例: 2231円 -> 3031円、824円 -> 1024円）
                if (hasu100 > 0) candidates.push(thousandBase + hasu100);
                // 下1桁端数出し（例: 2231円 -> 3001円、824円 -> 1004円）
                if (hasu10 > 0 && hasu10 !== hasu100) candidates.push(thousandBase + hasu10);

                candidates = Array.from(new Set(candidates)).filter(p => p > total);
                if (candidates.length > 0) {
                    return candidates[Math.floor(Math.random() * candidates.length)];
                }
            }

            // 3. 基本の千円札切り上げ（最優先・全体の約80%）
            // 例: 2231円なら 3000円、824円なら 1000円
            return thousandBase;
        }

        async function openPaymentModal() {
            isSolved = false; 
            document.getElementById("action-buttons-row").classList.remove("hidden");
            document.getElementById("show-receipt-btn").classList.add("hidden");

            totalAmount = cart.reduce((s, i) => s + i.price, 0);
            paidAmount = getOptimalPayment(totalAmount);
            changeAmount = paidAmount - totalAmount;
            
            document.getElementById("payment-info").innerText = `ごうけい ${totalAmount} 円。おさいふから ${paidAmount} 円 だしました！`;
            renderGrid();
            document.getElementById("payment-modal").classList.remove("hidden");
            
            await stopZXingScanner();
            setTimeout(resizeCanvas, 100);
        }

        function closePaymentModal() { 
            document.getElementById("payment-modal").classList.add("hidden"); 
            startZXingScanner();
        }

        function resetAppAndCloseSuccess() { 
            document.getElementById("success-modal").classList.add("hidden"); 
            clearCart(); 
            startZXingScanner();
        }

        function renderGrid() {
            const cols = paidAmount >= 10000 ? 6 : 5;
            const container = document.getElementById("calculation-grid-container");
            container.innerHTML = `<div id="calculation-grid" class="grid grid-cols-${cols} border-t border-l border-sky-200"></div>`;
            const grid = container.firstChild;

            const paidStr = paidAmount.toString().padStart(cols, " ");
            const totalStr = totalAmount.toString().padStart(cols - 1, " ");

            for(let i=0; i<cols; i++) grid.innerHTML += `<div class="graph-cell h-24 sm:h-32 bg-sky-50/30"></div>`; 
            for(let i=0; i<cols; i++) grid.innerHTML += `<div class="graph-cell h-16 sm:h-20 text-3xl sm:text-4xl font-bold font-kyokasho text-slate-800">${paidStr[i] !== " " ? paidStr[i] : ""}</div>`; 
            grid.innerHTML += `<div class="graph-cell h-16 sm:h-20 text-4xl sm:text-5xl font-black text-blue-600 font-kyokasho">－</div>`; 
            for(let i=0; i<cols-1; i++) grid.innerHTML += `<div class="graph-cell h-16 sm:h-20 text-3xl sm:text-4xl font-bold font-kyokasho text-slate-800">${totalStr[i] !== " " ? totalStr[i] : ""}</div>`;
            grid.innerHTML += `<div class="col-span-${cols} h-1.5 bg-slate-800 my-1"></div>`; 
            for(let i=0; i<cols; i++) grid.innerHTML += `<div class="graph-cell h-12 sm:h-16 bg-sky-50/10"></div>`; 

            const ansContainer = document.getElementById("answer-grid-container");
            ansContainer.innerHTML = `<div class="grid grid-cols-${cols} mt-2"><div class="flex items-center justify-center text-3xl sm:text-4xl font-black text-slate-400">=</div></div>`;
            const ansGrid = ansContainer.firstChild;
            if(cols===6) ansGrid.innerHTML += `<div class="m-1 h-16 sm:h-20"></div>`;
            
            for(let i=3; i>=0; i--) ansGrid.innerHTML += `<div onclick="focusDigit(${i})" id="ans-box-${i}" class="m-1 h-16 sm:h-20 bg-amber-50 border-2 border-slate-300 rounded-lg flex items-center justify-center text-3xl sm:text-4xl font-black text-amber-700 cursor-pointer transition font-kyokasho"></div>`;
            
            userAnswers = ["","","",""]; 
            focusDigit(0);
        }

        function focusDigit(idx) {
            currentFocusIndex = idx;
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-box-${i}`);
                if(b) b.className = (i===idx) ? "m-1 h-16 sm:h-20 bg-yellow-100 border-4 border-amber-400 rounded-lg flex items-center justify-center text-3xl sm:text-4xl font-black text-amber-800 scale-105 font-kyokasho" : "m-1 h-16 sm:h-20 bg-amber-50 border-2 border-slate-300 rounded-lg flex items-center justify-center text-3xl sm:text-4xl font-black text-amber-700 cursor-pointer font-kyokasho";
            }
        }

        function pressKey(k) {
            if (isSolved) return; 
            initAudio();
            if(typeof k === 'number') {
                userAnswers[currentFocusIndex] = k.toString();
                document.getElementById(`ans-box-${currentFocusIndex}`).innerText = k;
                if(currentFocusIndex < 3) focusDigit(currentFocusIndex + 1);
            } else if(k === 'BS') {
                userAnswers[currentFocusIndex] = ""; 
                document.getElementById(`ans-box-${currentFocusIndex}`).innerText = "";
                if(currentFocusIndex > 0) focusDigit(currentFocusIndex - 1);
            } else if(k === 'C') {
                userAnswers = ["","","",""]; 
                for(let i=0; i<4; i++) document.getElementById(`ans-box-${i}`).innerText = ""; 
                focusDigit(0);
            }
        }

        function playCorrectChime() {
            if (synth) {
                const now = Tone.now();
                synth.triggerAttackRelease("C5", "8n", now);
                synth.triggerAttackRelease("E5", "8n", now + 0.1);
                synth.triggerAttackRelease("G5", "8n", now + 0.2);
                synth.triggerAttackRelease("C6", "4n", now + 0.3);
            }
        }

        function playIncorrectChime() {
            if (synth) {
                const now = Tone.now();
                synth.triggerAttackRelease("A3", "8n", now);
                synth.triggerAttackRelease("A3", "8n", now + 0.15);
            }
        }

        function checkAnswer() {
            if (isSolved) return;
            let s = ""; 
            for(let i=3; i>=0; i--) s += userAnswers[i] || (s===""?"":"0");
            
            if(parseInt(s || "0") === changeAmount) {
                isSolved = true;
                playCorrectChime();
                solvedCount++; 
                showReceiptButton();
            } else {
                playIncorrectChime();
            }
        }

        function showAnswerAutomatic() {
            if (isSolved) return;
            isSolved = true;
            const strChange = changeAmount.toString();
            userAnswers = ["", "", "", ""];
            for(let i=0; i<4; i++) document.getElementById(`ans-box-${i}`).innerText = "";
            let strIdx = strChange.length - 1;
            for(let i=0; i<strChange.length; i++) {
                userAnswers[i] = strChange[strIdx - i];
                document.getElementById(`ans-box-${i}`).innerText = userAnswers[i];
            }
            currentFocusIndex = -1;
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-box-${i}`);
                if (!userAnswers[i]) b.className = "m-1 h-16 sm:h-20 bg-amber-50 border-2 border-slate-300 rounded-lg flex items-center justify-center text-3xl sm:text-4xl font-black text-amber-700 font-kyokasho";
            }
            playCorrectChime();
            showReceiptButton();
        }

        function showReceiptButton() {
            document.getElementById("action-buttons-row").classList.add("hidden"); 
            document.getElementById("show-receipt-btn").classList.remove("hidden");
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-box-${i}`);
                if (b && userAnswers[i]) {
                    b.classList.remove("bg-yellow-100", "border-amber-400", "text-amber-800", "bg-amber-50", "text-amber-700", "border-slate-300");
                    b.classList.add("bg-sky-100", "border-4", "border-sky-400", "text-sky-800", "scale-105"); 
                }
            }
        }

        function showReceipt() {
            document.getElementById("payment-modal").classList.add("hidden");
            const d = new Date(); 
            document.getElementById("receipt-date").innerText = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
            document.getElementById("receipt-tx-no").innerText = Math.floor(Math.random() * 9000) + 1000;
            
            const list = document.getElementById("receipt-items-list"); 
            list.innerHTML = "";
            cart.forEach(i => {
                list.innerHTML += `<li class="flex justify-between text-black font-bold font-kyokasho"><span>${i.name}</span><span>${i.price} 円</span></li>`;
            });
            
            document.getElementById("receipt-total-cost").innerText = totalAmount.toLocaleString();
            document.getElementById("receipt-paid-amount").innerText = paidAmount.toLocaleString();
            document.getElementById("receipt-change-amount").innerText = changeAmount.toLocaleString();
            
            document.getElementById("success-modal").classList.remove("hidden");
        }

        let canvas, ctx, isDrawing = false, penColor = '#ef4444';
        function setupMemoCanvas() {
            canvas = document.getElementById("memo-canvas"); 
            if (!canvas) return;
            ctx = canvas.getContext("2d");
            
            const draw = (e) => {
                if(!isDrawing || !ctx) return;
                const r = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                ctx.lineTo(x, y); 
                ctx.strokeStyle = penColor; 
                ctx.lineWidth = 4; 
                ctx.lineCap = "round"; 
                ctx.stroke();
            };
            
            canvas.onmousedown = (e) => { 
                isDrawing = true; ctx.beginPath(); 
                const r = canvas.getBoundingClientRect(); 
                ctx.moveTo(e.clientX-r.left, e.clientY-r.top); 
            };
            canvas.onmousemove = draw;
            window.onmouseup = () => isDrawing = false;
            
            canvas.addEventListener("touchstart", (e) => { 
                isDrawing = true; ctx.beginPath(); 
                const r = canvas.getBoundingClientRect(); 
                ctx.moveTo(e.touches[0].clientX-r.left, e.touches[0].clientY-r.top); 
                e.preventDefault(); 
            }, { passive: false });
            canvas.addEventListener("touchmove", (e) => { draw(e); e.preventDefault(); }, { passive: false });
            canvas.addEventListener("touchend", () => isDrawing = false);
        }
        
        function resizeCanvas() { 
            const c = document.getElementById("canvas-container"); 
            if (c && canvas && c.offsetWidth > 0) {
                canvas.width = c.offsetWidth; canvas.height = c.offsetHeight; 
            } else setTimeout(resizeCanvas, 50);
        }

        function setPenColor(color) {
            penColor = color;
            document.getElementById("btn-pen-red").className = color === '#ef4444' ? "w-6 h-6 rounded-full bg-red-500 border-2 border-white ring-2 ring-red-500" : "w-6 h-6 rounded-full bg-red-500 border-2 border-white";
            document.getElementById("btn-pen-blue").className = color === '#3b82f6' ? "w-6 h-6 rounded-full bg-blue-500 border-2 border-white ring-2 ring-blue-500" : "w-6 h-6 rounded-full bg-blue-500 border-2 border-white";
            document.getElementById("btn-pen-black").className = color === '#1e293b' ? "w-6 h-6 rounded-full bg-slate-800 border-2 border-white ring-2 ring-slate-800" : "w-6 h-6 rounded-full bg-slate-800 border-2 border-white";
        }

        function clearCanvas() { if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height); }
    </script>
