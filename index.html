<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>セルフレジでおかいけいしよう</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body, button, input, p, h1, h2, h3, h4 {
            font-family: 'M PLUS Rounded 1c', "Hiragino Maru Gothic ProN", sans-serif;
        }

        .font-kyokasho {
            font-family: "UD Digi Kyokasho NK-R", "UD デジタル教科書体 NK-R", "UD Digi Kyokasho NP-R", "UD デジタル教科書体 NP-R", "UD デジタル教科書体", "游教科書体", "YuMincho", "Yu Mincho", "Hiragino Mincho ProN", serif !important;
        }

        /* 映像コンテナ：自然な比率を保ち、座標ズレをなくす（スマホ対応の要） */
        #reader {
            border: none !important;
            background-color: #000 !important;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #reader video {
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important;
            object-fit: contain !important; /* 映像を歪めない＆切り取らない（絶対重要） */
            display: block;
        }
        
        .mirror-video video {
            transform: scaleX(-1) !important;
        }

        /* ライブラリのデフォルトUIを非表示 */
        #reader__scan_region img,
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_csr button,
        #reader__dashboard_section_swaplink {
            display: none !important;
        }
        
        /* デフォルトの暗転オーバーレイを消し、自作のUIを目立たせる */
        div[style*="background-color: rgba(0, 0, 0, 0.48)"],
        div[style*="background-color:rgba(0, 0, 0, 0.48)"] {
            display: none !important;
        }

        #reader__scan_region div,
        #reader__scan_region span,
        [id$="qrbox-border"] {
            border: none !important;
            box-shadow: none !important;
            outline: none !important;
        }

        #reader div, #reader td, #reader table {
            border: none !important;
            box-shadow: none !important;
            background: transparent !important;
        }

        @keyframes laser-sweep {
            0% { top: 5%; opacity: 0.4; filter: drop-shadow(0 0 1px rgba(239, 68, 68, 0.7)); }
            50% { top: 95%; opacity: 1; filter: drop-shadow(0 0 4px rgba(239, 68, 68, 1)) drop-shadow(0 0 8px rgba(239, 68, 68, 0.8)); }
            100% { top: 5%; opacity: 0.4; filter: drop-shadow(0 0 1px rgba(239, 68, 68, 0.7)); }
        }

        .scanning-laser {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background-color: #ef4444;
            z-index: 10;
            animation: laser-sweep 2.2s infinite ease-in-out;
            pointer-events: none;
        }

        .graph-cell {
            position: relative;
            border-right: 1px solid #bae6fd;
            border-bottom: 1px solid #bae6fd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-select { 
            -webkit-touch-callout: none; 
            user-select: none; 
        }

        .receipt-paper {
            position: relative; 
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-top: 8px solid #10b981; 
        }
    </style>
</head>
<body class="h-screen flex flex-col select-none bg-slate-50 no-select">

    <header class="bg-emerald-600 text-white p-2 sm:p-3 shadow-md flex justify-between items-center z-10 flex-shrink-0">
        <h1 class="text-lg sm:text-2xl font-bold flex items-center gap-2">🛒 セルフレジでおかいけいしよう</h1>
        <span class="bg-emerald-800 text-xs px-3 py-1 rounded-full font-bold hidden sm:inline">たのしいお買い物＆ひっ算おつり計算</span>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row p-1 sm:p-3 gap-1 sm:gap-3 overflow-hidden h-full min-h-0">
        
        <!-- 左：スキャンエリア -->
        <section class="w-full lg:flex-1 bg-white rounded-xl shadow-lg flex flex-col p-1.5 sm:p-3 border border-emerald-100 flex-shrink-0 lg:min-h-0">
            <div class="flex justify-between items-center mb-1">
                <h2 class="text-sm sm:text-xl font-bold text-gray-700 flex items-center gap-1.5">
                    <span>📸</span> バーコードをスキャン！
                </h2>
                <button id="camera-toggle-btn" onclick="toggleCameraState()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-1 px-3 sm:py-2 sm:px-4 rounded-full shadow-md active:scale-95 transition text-xs sm:text-sm flex items-center gap-1">
                    ▶️ はじめる
                </button>
            </div>
            
            <!-- カメラ領域 -->
            <div class="relative w-full h-[220px] sm:h-[40vh] lg:h-auto lg:flex-1 bg-black rounded-lg overflow-hidden flex flex-col items-center justify-center border-2 border-slate-700">
                <div id="scanner-container" class="absolute inset-0 w-full h-full flex items-center justify-center overflow-hidden">
                    <!-- カメラ映像 -->
                    <div id="reader" class="w-full h-full"></div>
                    
                    <!-- 【重要】内部のqrbox(300x150)とサイズを完璧に合わせたUIガイド枠 -->
                    <div class="absolute inset-0 z-10 pointer-events-none flex flex-col items-center justify-center overflow-hidden">
                        <div class="mb-2 text-white text-[11px] sm:text-sm font-bold bg-slate-900/60 px-3 py-1 rounded-full backdrop-blur-sm border border-white/20 shadow-lg">
                            💡 すこし はなして うつしてね！
                        </div>
                        <div class="relative w-[220px] h-[110px] sm:w-[300px] sm:h-[150px] rounded-lg shadow-[0_0_0_9999px_rgba(15,23,42,0.5)] flex items-center justify-center border border-white/40">
                            <!-- 四隅の白い枠 -->
                            <div class="absolute top-0 left-0 w-4 h-4 border-t-4 border-l-4 border-white rounded-tl-sm"></div>
                            <div class="absolute top-0 right-0 w-4 h-4 border-t-4 border-r-4 border-white rounded-tr-sm"></div>
                            <div class="absolute bottom-0 left-0 w-4 h-4 border-b-4 border-l-4 border-white rounded-bl-sm"></div>
                            <div class="absolute bottom-0 right-0 w-4 h-4 border-b-4 border-r-4 border-white rounded-br-sm"></div>
                            <div class="scanning-laser"></div>
                        </div>
                    </div>
                    
                    <div id="camera-fallback-msg" class="absolute inset-0 bg-slate-950/90 text-white flex flex-col items-center justify-center p-4 text-center z-20 pointer-events-none">
                        <span class="text-3xl mb-2">📷</span>
                        <p class="font-bold text-sm mb-1">カメラを準備しています...</p>
                    </div>
                </div>
            </div>

            <!-- 操作ボタン群 -->
            <div class="mt-1.5 flex gap-1 justify-between items-center w-full flex-nowrap">
                <button onclick="triggerMockScan()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-0.5 rounded-lg shadow active:scale-95 transition text-[11px] sm:text-base flex-1 whitespace-nowrap text-center">
                    ⚡ ぴっ!(テスト)
                </button>
                <button onclick="toggleCameraFacing()" class="bg-slate-600 hover:bg-slate-700 text-white font-bold py-2.5 px-0.5 text-[11px] sm:text-sm rounded-lg flex-1 whitespace-nowrap text-center">
                    📷 切り替え
                </button>
                <button onclick="clearCart()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-2.5 px-0.5 text-[11px] sm:text-sm rounded-lg flex-1 whitespace-nowrap text-center">
                    🧹 からにする
                </button>
            </div>
        </section>

        <!-- 右：商品カートエリア -->
        <section class="flex-1 bg-white rounded-xl shadow-lg flex flex-col p-1.5 sm:p-3 min-h-0 border border-emerald-100">
            <h2 class="text-sm sm:text-xl font-bold mb-1 sm:mb-2 text-gray-700 border-b-2 border-gray-100 pb-1 flex items-center gap-1.5 flex-shrink-0">
                <span>📋</span> おかいあげ商品
            </h2>
            
            <!-- スクロール領域 -->
            <div id="cart-scroll-area" class="flex-1 min-h-0 overflow-y-auto mb-1 sm:mb-3 pr-1 scroll-smooth touch-pan-y" style="-webkit-overflow-scrolling: touch;">
                <ul id="cart-list" class="space-y-1">
                    <li id="cart-placeholder" class="text-gray-400 text-center mt-4 sm:mt-12 font-kyokasho text-sm sm:text-base">おかいもの を はじめよう！</li>
                </ul>
            </div>

            <div class="bg-slate-50 p-2 sm:p-3 rounded-xl border border-slate-200 flex-shrink-0 mt-auto">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-[11px] sm:text-base font-bold text-gray-600">お買い上げ点数:</span>
                    <span id="total-count" class="text-sm sm:text-lg font-bold">0 点</span>
                </div>
                <div class="flex justify-between items-center mb-1.5">
                    <span class="text-[11px] sm:text-base font-bold text-gray-600">ごうけい金額:</span>
                    <span class="text-lg sm:text-3xl font-black text-rose-600"><span id="total-price">0</span> 円</span>
                </div>
                <button id="checkout-btn" onclick="openPaymentModal()" disabled class="w-full bg-emerald-500 text-white font-black py-2 sm:py-3 rounded-xl text-sm sm:text-xl shadow hover:bg-emerald-600 transition disabled:bg-slate-300">
                    💳 おかいけいする
                </button>
            </div>
        </section>
    </main>

    <!-- おつり計算ひっ算モーダル -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-2 sm:p-4">
        <div class="bg-sky-50 rounded-2xl shadow-2xl max-w-4xl w-full flex flex-col overflow-hidden border-4 border-sky-400 max-h-full">
            <div class="bg-sky-500 text-white p-3 sm:p-4 text-center relative flex-shrink-0">
                <h3 class="text-lg sm:text-2xl font-bold">おつりを けいさん しよう！</h3>
                <p id="payment-info" class="text-xs sm:text-lg mt-1 font-semibold"></p>
                <canvas id="confetti-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-50"></canvas>
            </div>

            <div class="flex-1 flex flex-col md:flex-row p-2 sm:p-4 gap-2 sm:gap-4 overflow-y-auto">
                <div class="flex flex-col gap-1 sm:gap-2 w-full max-w-[340px] mx-auto">
                    <div class="relative w-full flex items-center justify-between bg-white px-2 py-1 rounded-lg shadow-sm border border-sky-100">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[10px] sm:text-xs text-gray-500 font-bold">✍️ メモペン:</span>
                            <button onclick="setPenColor('#ef4444')" id="btn-pen-red" class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-red-500 border-2 border-white ring-2 ring-red-500"></button>
                            <button onclick="setPenColor('#3b82f6')" id="btn-pen-blue" class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-blue-500 border-2 border-white"></button>
                            <button onclick="setPenColor('#1e293b')" id="btn-pen-black" class="w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-slate-800 border-2 border-white"></button>
                        </div>
                        <button onclick="clearCanvas()" class="text-[10px] sm:text-xs bg-amber-100 text-amber-800 font-bold py-1 px-2 rounded hover:bg-amber-200 transition">🧹 消す</button>
                    </div>

                    <div class="relative w-full bg-white rounded-xl shadow-lg border-2 border-sky-300 p-1.5 sm:p-2 overflow-hidden">
                        <div class="relative w-full" id="canvas-container">
                            <div id="calculation-grid-container"></div>
                            <canvas id="memo-canvas" class="absolute top-0 left-0 w-full h-full cursor-crosshair z-20 touch-none"></canvas>
                        </div>
                        <div id="answer-grid-container"></div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col justify-center items-center max-w-sm mx-auto w-full">
                    <div class="grid grid-cols-3 gap-1.5 sm:gap-2 w-full font-kyokasho">
                        <button onclick="pressKey(7)" class="bg-white p-3 sm:p-5 rounded-xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50">7</button>
                        <button onclick="pressKey(8)" class="bg-white p-3 sm:p-5 rounded-xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50">8</button>
                        <button onclick="pressKey(9)" class="bg-white p-3 sm:p-5 rounded-xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50">9</button>
                        <button onclick="pressKey(4)" class="bg-white p-3 sm:p-5 rounded-xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50">4</button>
                        <button onclick="pressKey(5)" class="bg-white p-3 sm:p-5 rounded-xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50">5</button>
                        <button onclick="pressKey(6)" class="bg-white p-3 sm:p-5 rounded-xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50">6</button>
                        <button onclick="pressKey(1)" class="bg-white p-3 sm:p-5 rounded-xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50">1</button>
                        <button onclick="pressKey(2)" class="bg-white p-3 sm:p-5 rounded-xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50">2</button>
                        <button onclick="pressKey(3)" class="bg-white p-3 sm:p-5 rounded-xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50">3</button>
                        <button onclick="pressKey('C')" class="bg-rose-100 p-2 sm:p-5 rounded-xl text-sm sm:text-xl font-bold hover:bg-rose-200">消す</button>
                        <button onclick="pressKey(0)" class="bg-white p-3 sm:p-5 rounded-xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50">0</button>
                        <button onclick="pressKey('BS')" class="bg-amber-100 p-2 sm:p-5 rounded-xl text-sm sm:text-xl font-bold hover:bg-amber-200">⬅戻る</button>
                    </div>
                    
                    <div class="mt-2 sm:mt-4 w-full flex flex-col gap-2">
                        <div class="flex gap-1.5 w-full" id="action-buttons-row">
                            <button onclick="closePaymentModal()" class="flex-1 bg-slate-400 text-white font-bold py-2.5 rounded-lg hover:bg-slate-500 text-[11px] sm:text-[13px]">やめる</button>
                            <button onclick="showAnswerAutomatic()" class="flex-1 bg-sky-500 text-white font-bold py-2.5 rounded-lg hover:bg-sky-600 text-[11px] sm:text-[13px]">💡おつりをみる</button>
                            <button onclick="checkAnswer()" class="flex-1 bg-amber-500 text-white font-black py-2.5 rounded-lg hover:bg-amber-600 text-[11px] sm:text-[13px]">答え合わせ</button>
                        </div>
                        <button id="show-receipt-btn" onclick="showReceipt()" class="hidden w-full bg-emerald-500 text-white font-black py-2.5 sm:py-4 rounded-xl text-base sm:text-xl shadow hover:bg-emerald-600 animate-pulse">
                            🧾 レシートをみる！
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- レシート（成功）モーダル -->
    <div id="success-modal" class="hidden fixed inset-0 bg-slate-950/80 z-50 overflow-y-auto flex justify-center items-start py-8 sm:py-12 px-4">
        <div class="flex flex-col items-center max-w-sm w-full">
            <div class="receipt-paper w-full bg-white text-black p-5 font-bold text-sm">
                <div class="absolute top-4 right-4 border-4 border-rose-600 text-rose-600 text-[10px] font-black px-1.5 py-0.5 rounded-lg rotate-12 bg-white/95 shadow-sm z-10">💮 よくできました</div>
                <div class="text-center mb-4 mt-2 pr-20 relative">
                    <div class="text-base font-black text-black font-kyokasho">🌻 こどもマーケット さくら店</div>
                    <div class="text-[10px] text-slate-900 font-bold">おつり計算セルフレジ 特訓コーナー</div>
                </div>
                <div class="border-b border-dashed border-slate-500 my-2"></div>
                
                <div class="flex justify-between text-[10px] text-slate-900 px-1 font-bold">
                    <span id="receipt-date"></span>
                    <span>レジ: 001</span>
                </div>
                <div class="flex justify-between text-[10px] text-slate-900 px-1 mt-0.5 font-bold">
                    <span>担 当: 店長</span>
                    <span>取引No. <span id="receipt-tx-no"></span></span>
                </div>

                <div class="border-b border-dashed border-slate-500 my-2"></div>
                <ul id="receipt-items-list" class="space-y-1 my-2 text-[11px] text-black font-bold max-h-40 overflow-y-auto"></ul>
                <div class="border-b border-dashed border-slate-500 my-2"></div>
                
                <div class="space-y-1.5 font-black mt-2 text-black text-sm">
                    <div class="flex justify-between border-b border-slate-500 pb-1">
                        <span>合計（内税）</span>
                        <span><span id="receipt-total-cost">0</span> 円</span>
                    </div>
                    <div class="flex justify-between pt-1 font-black text-black">
                        <span>おあずかり</span>
                        <span><span id="receipt-paid-amount">0</span> 円</span>
                    </div>
                    <div class="flex justify-between border-t border-slate-500 pt-1 mt-1 font-black text-black">
                        <span>おつり</span>
                        <span><span id="receipt-change-amount">0</span> 円</span>
                    </div>
                </div>

                <div class="flex justify-center items-center gap-0.5 mt-4 mb-2 h-6 opacity-90">
                    <div class="w-1 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div><div class="w-1 h-full bg-slate-950"></div>
                    <div class="w-3 h-full bg-slate-950"></div><div class="w-1 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div>
                    <div class="w-1 h-full bg-slate-950"></div><div class="w-3 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div>
                    <div class="w-1 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div><div class="w-1 h-full bg-slate-950"></div>
                </div>
                <div class="text-center text-[10px] text-slate-900 font-bold">
                    <p>お買い上げありがとうございました！</p>
                </div>
            </div>
            <button onclick="resetAppAndCloseSuccess()" class="w-full mt-4 bg-amber-500 hover:bg-amber-600 text-white font-black py-3 rounded-xl text-lg shadow-lg transition">つぎのお買い物へ！</button>
        </div>
    </div>

    <script>
        const dummyProducts = [
            { name: "りんご (🍎)", price: 124 }, { name: "みかん (🍊)", price: 87 },
            { name: "バナナ (🍌)", price: 158 }, { name: "いちご (🍓)", price: 398 },
            { name: "メロン (🍈)", price: 980 }, { name: "すいか (🍉)", price: 1250 },
            { name: "にんじん (🥕)", price: 93 }, { name: "キャベツ (🥬)", price: 148 },
            { name: "トマト (🍅)", price: 115 }, { name: "おにぎり (🍙)", price: 135 },
            { name: "クロワッサン (🥐)", price: 186 }, { name: "食パン (🍞)", price: 218 },
            { name: "サンドイッチ (🥪)", price: 324 }, { name: "うどん (🍜)", price: 412 },
            { name: "おすし (🍣)", price: 880 }, { name: "ショートケーキ (🍰)", price: 453 },
            { name: "ぷるぷるプリン (🍮)", price: 198 }, { name: "バニラアイス (🍨)", price: 162 },
            { name: "板チョコレート (🍫)", price: 108 }, { name: "手作りクッキー (🍪)", price: 216 },
            { name: "棒キャンディ (🍬)", price: 74 }, { name: "ペットボトル緑茶 (🍵)", price: 147 },
            { name: "おいしい牛乳 (🥛)", price: 205 }, { name: "オレンジジュース (🍹)", price: 156 },
            { name: "冷たいコーラ (🥤)", price: 138 }, { name: "クマのぬいぐるみ (🧸)", price: 1480 },
            { name: "赤いミニカー (🚗)", price: 495 }, { name: "トランプ (🃏)", price: 312 },
            { name: "ポテトフライ (🍟)", price: 243 }, { name: "チョコドーナツ (🍩)", price: 154 },
            { name: "チーズバーガー (🍔)", price: 392 }, { name: "ビーフカレー (🍛)", price: 624 },
            { name: "ポテトチップス (🥔)", price: 119 }, { name: "フルーツグミ (🍬)", price: 122 }
        ];

        const bookProducts = [
            { name: "学習ノート (📓)", price: 118 }, { name: "２Ｂえんぴつ (✏️)", price: 63 },
            { name: "よく消える消しゴム (🧽)", price: 84 }, { name: "安全はさみ (✂️)", price: 275 },
            { name: "カラフルおりがみ (🎨)", price: 198 }, { name: "おもしろい絵本 (📖)", price: 836 },
            { name: "おえかきちょう (🎨)", price: 145 }, { name: "12色クレヨン (🖍️)", price: 382 },
            { name: "じゆうちょう (📒)", price: 123 }, { name: "30cmじょうぎ (📏)", price: 134 }
        ];

        let cart = []; 
        let html5QrcodeScanner = null;
        let currentCameraId = null;
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth < 1024);
        
        let isScannerTransitioning = false;
        let isSolved = false;
        let synth = null;
        let totalAmount = 0, paidAmount = 0, changeAmount = 0;
        let currentFocusIndex = 0;
        let userAnswers = ["", "", "", ""];
        let isCameraActive = false; // ★これを追加

        // どんな読み取り揺らぎがあっても「絶対に100%固定の商品」を返す安定化ハッシュ
        function getProductFromBarcode(barcode) {
            // 先頭に0が付くなどのカメラの気まぐれを無視し、「お尻の8桁」だけを確実に切り取る
            const seedStr = barcode.length >= 8 ? barcode.slice(-8) : barcode;
            
            let hash = 2166136261; 
            for (let i = 0; i < seedStr.length; i++) {
                hash ^= seedStr.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            
            // 書籍コード(97/19始まり)の特別処理
            if (barcode.startsWith("97") || barcode.startsWith("19")) {
                return bookProducts[Math.abs(hash) % bookProducts.length];
            }
            return dummyProducts[Math.abs(hash) % dummyProducts.length];
        }

        async function initScanner() {
            const container = document.getElementById("camera-fallback-msg");
            container.classList.remove("hidden");

            try {
                const devices = await Html5Qrcode.getCameras();
                if (devices && devices.length > 0) {
                    let targetCamera = null;
                    if (isMobile) {
                        targetCamera = devices.find(d => d.label.toLowerCase().includes("back") || d.label.toLowerCase().includes("environment"));
                    } else {
                        targetCamera = devices.find(d => d.label.toLowerCase().includes("front") || d.label.toLowerCase().includes("user"));
                    }
                    if (!targetCamera) targetCamera = devices[0];
                    currentCameraId = targetCamera.id;
                    
                    const readerDiv = document.getElementById("reader");
                    const label = targetCamera.label.toLowerCase();
                    let isMirror = false;
                    
                    if (label.includes("front") || label.includes("user") || label.includes("イン") || label.includes("前面") || label.includes("integrated") || label.includes("facetime") || label.includes("内蔵")) {
                        isMirror = true;
                    } else if (label.includes("back") || label.includes("environment") || label.includes("アウト") || label.includes("背面")) {
                        isMirror = false;
                    } else {
                        // 判別できない場合、カメラが1つならPC内蔵(鏡)と推測、複数ならスマホ背面(非鏡)と推測
                        isMirror = devices.length === 1;
                    }

                    if (isMirror) {
                        readerDiv.classList.add("mirror-video");
                    } else {
                        readerDiv.classList.remove("mirror-video");
                    }

                    startScanning(currentCameraId);
                } else {
                    container.innerHTML = `<span class="text-3xl mb-2">⚠️</span><p class="font-bold text-sm text-rose-400">カメラが見つかりません</p>`;
                    resetCameraToggleBtn();
                }
            } catch (err) {
                container.innerHTML = `<span class="text-3xl mb-2">⚠️</span><p class="font-bold text-sm text-rose-400">カメラを起動できませんでした</p>`;
                resetCameraToggleBtn();
            }
        }

        async function startScanning(cameraId) {
            if (isScannerTransitioning) return;
            isScannerTransitioning = true;

            try {
                if (html5QrcodeScanner) {
                    try { await html5QrcodeScanner.stop(); } catch(e){}
                    try { html5QrcodeScanner.clear(); } catch(e){}
                }
                
                document.getElementById("reader").innerHTML = "";
                html5QrcodeScanner = new Html5Qrcode("reader");

                // ★起動用パラメータは絶対に「cameraId」文字列のままにして、真っ黒になる暴走を100%防ぐ★
                let startParam = cameraId;

                // 基本設定
                const config = {
                    fps: 15,
                    // ★全く新しいアプローチ：スマホ内蔵の「ネイティブ・バーコード認識機能」を解禁！★
                    // これにより、画質やピント問題を超越して、OSレベルの超高速スキャンが行われます。
                    experimentalFeatures: {
                        useBarCodeDetectorIfSupported: true
                    }
                };
                
                if (typeof Html5QrcodeSupportedFormats !== 'undefined') {
                    config.formatsToSupport = [ 
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E
                    ];
                }

                await html5QrcodeScanner.start(
                    startParam,
                    config,
                    onScanSuccessInternal,
                    onScanErrorInternal
                );
                
                document.getElementById("camera-fallback-msg").classList.add("hidden");
            } catch (e) {
                document.getElementById("camera-fallback-msg").innerHTML = `<span class="text-3xl mb-2">⚠️</span><p class="font-bold text-sm text-rose-400">カメラの起動に失敗しました: 再読み込みしてください</p>`;
                resetCameraToggleBtn();
            } finally {
                isScannerTransitioning = false;
            }
        }

        let lastScanTime = 0;
        let scanBuffer = [];
        
        function onScanSuccessInternal(decodedText) {
            const now = Date.now();
            let cleanCode = decodedText.replace(/[^0-9]/g, ''); 
            
            // 短すぎるノイズは無視
            if (cleanCode.length < 8) return;

            // 「2回連続で同じ数字が出たら合格」という優しく確実なルール
            scanBuffer.push(cleanCode);
            if (scanBuffer.length > 2) scanBuffer.shift(); 
            
            const isMatch = scanBuffer.length === 2 && scanBuffer[0] === scanBuffer[1];
            
            if (isMatch) {
                if (now - lastScanTime < 1000) return; // 連続スキャンのクールダウン（1秒）
                lastScanTime = now;
                scanBuffer = []; // リセット
                
                addToCart(getProductFromBarcode(cleanCode));
            }
        }

        function onScanErrorInternal() {}

        async function toggleCameraFacing() {
            if (isScannerTransitioning || !isCameraActive) return; // カメラがオフの時は切り替えを防止
            try {
                const devices = await Html5Qrcode.getCameras();
                if (devices.length > 1) {
                    const currentIndex = devices.findIndex(d => d.id === currentCameraId);
                    const nextCamera = devices[(currentIndex + 1) % devices.length];
                    currentCameraId = nextCamera.id;
                    
                    const readerDiv = document.getElementById("reader");
                    const label = nextCamera.label.toLowerCase();
                    let isMirror = false;
                    
                    if (label.includes("front") || label.includes("user") || label.includes("イン") || label.includes("前面") || label.includes("integrated") || label.includes("facetime") || label.includes("内蔵")) {
                        isMirror = true;
                    } else if (label.includes("back") || label.includes("environment") || label.includes("アウト") || label.includes("背面")) {
                        isMirror = false;
                    } else {
                        // ラベルで判別できない場合は、今の反転状態を逆にする
                        isMirror = !readerDiv.classList.contains("mirror-video");
                    }

                    if (isMirror) {
                        readerDiv.classList.add("mirror-video");
                    } else {
                        readerDiv.classList.remove("mirror-video");
                    }

                    startScanning(currentCameraId);
                }
            } catch (e) {}
        }

        let canvas, ctx, isDrawing = false, penColor = '#ef4444';
        function setupMemoCanvas() {
            canvas = document.getElementById("memo-canvas"); 
            if (!canvas) return;
            ctx = canvas.getContext("2d");
            
            const draw = (e) => {
                if(!isDrawing || !ctx) return;
                const r = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                ctx.lineTo(x, y); 
                ctx.strokeStyle = penColor; 
                ctx.lineWidth = 4; 
                ctx.lineCap = "round"; 
                ctx.stroke();
            };
            
            canvas.onmousedown = (e) => { 
                isDrawing = true; ctx.beginPath(); 
                const r = canvas.getBoundingClientRect(); 
                ctx.moveTo(e.clientX-r.left, e.clientY-r.top); 
            };
            canvas.onmousemove = draw;
            window.onmouseup = () => isDrawing = false;
            
            canvas.addEventListener("touchstart", (e) => { 
                isDrawing = true; ctx.beginPath(); 
                const r = canvas.getBoundingClientRect(); 
                ctx.moveTo(e.touches[0].clientX-r.left, e.touches[0].clientY-r.top); 
                e.preventDefault(); 
            }, { passive: false });
            canvas.addEventListener("touchmove", (e) => { draw(e); e.preventDefault(); }, { passive: false });
            canvas.addEventListener("touchend", () => isDrawing = false);
        }
        
        function resizeCanvas() { 
            const c = document.getElementById("canvas-container"); 
            if (c && canvas && c.offsetWidth > 0) {
                canvas.width = c.offsetWidth; canvas.height = c.offsetHeight; 
            } else setTimeout(resizeCanvas, 50);
        }

        function setPenColor(color) {
            penColor = color;
            document.getElementById("btn-pen-red").className = color === '#ef4444' ? "w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-red-500 border-2 border-white ring-2 ring-red-500" : "w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-red-500 border-2 border-white";
            document.getElementById("btn-pen-blue").className = color === '#3b82f6' ? "w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-blue-500 border-2 border-white ring-2 ring-blue-500" : "w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-blue-500 border-2 border-white";
            document.getElementById("btn-pen-black").className = color === '#1e293b' ? "w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-slate-800 border-2 border-white ring-2 ring-slate-800" : "w-5 h-5 sm:w-6 sm:h-6 rounded-full bg-slate-800 border-2 border-white";
        }

        let confettiLoop;
        function startConfetti() {
            const cvs = document.getElementById('confetti-canvas');
            if(!cvs) return;
            const c = cvs.getContext('2d');
            cvs.width = cvs.offsetWidth; cvs.height = cvs.offsetHeight;
            const particles = [];
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];
            
            for(let i=0; i<100; i++) {
                particles.push({
                    x: Math.random() * cvs.width, y: Math.random() * cvs.height - cvs.height,
                    r: Math.random() * 6 + 2, d: Math.random() * 100,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.floor(Math.random() * 10) - 10, tiltAngleInc: (Math.random() * 0.07) + 0.05, tiltAngle: 0
                });
            }
            
            function render() {
                c.clearRect(0, 0, cvs.width, cvs.height);
                particles.forEach((p, i) => {
                    p.tiltAngle += p.tiltAngleInc;
                    p.y += (Math.cos(p.d) + 1 + p.r / 2) / 2;
                    p.x += Math.sin(p.d);
                    p.tilt = Math.sin(p.tiltAngle) * 15;
                    c.beginPath(); c.lineWidth = p.r; c.strokeStyle = p.color;
                    c.moveTo(p.x + p.tilt + p.r, p.y); c.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                    c.stroke();
                    if(p.y > cvs.height) { p.x = Math.random() * cvs.width; p.y = -20; }
                });
                confettiLoop = requestAnimationFrame(render);
            }
            render();
        }
        function stopConfetti() { if(confettiLoop) cancelAnimationFrame(confettiLoop); }
    </script>
</body>
</html>
