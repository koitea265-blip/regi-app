<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>セルフレジでおかいけいしよう</title>
    
    <!-- 必要なライブラリの読み込み -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght=500;700;900&display=swap" rel="stylesheet">

    <style>
        body, button, input, p, h1, h2, h3, h4 {
            font-family: 'M PLUS Rounded 1c', "Hiragino Maru Gothic ProN", sans-serif;
        }

        .font-kyokasho {
            font-family: "UD Digi Kyokasho NK-R", "UD デジタル教科書体 NK-R", "UD Digi Kyokasho NP-R", "UD デジタル教科書体 NP-R", "UD デジタル教科書体", "游教科書体", "YuMincho", "Yu Mincho", "Hiragino Mincho ProN", serif !important;
        }

        /* カメラ表示エリアのスタイル設定 */
        #reader {
            border: none !important;
            background-color: #0d1117 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            width: 100% !important; 
            height: 100% !important;
        }

        #reader video {
            border-radius: 0.5rem;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: cover;
            opacity: 1 !important;
            display: block !important;
        }
        
        /* インカメラなどの鏡像対応（左右反転） */
        .mirror-video video {
            transform: scaleX(-1) !important;
        }

        /* 【重要】ライブラリが自動生成する不要なUI・グレー二重枠・黒マスクの完全な非表示化 */
        #reader__scan_region img,
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_csr button,
        #reader__dashboard_section_swaplink,
        div[style*="background-color: rgba(0, 0, 0, 0.48)"],
        div[style*="background-color:rgba(0, 0, 0, 0.48)"] {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* ライブラリ標準のグレー線枠やL字枠を100%透明化・非表示にして二重枠を防ぐ */
        #reader__scan_region div,
        #reader__scan_region span,
        [id*="qrbox-border"],
        .qrbox-border,
        div[style*="border"] {
            border: none !important;
            box-shadow: none !important;
            outline: none !important;
            display: none !important;
        }

        /* 【究極の二重枠対策】映像(video)以外の自動生成divを完璧に非表示 */
        #reader__scan_region > div {
            display: none !important;
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* スキャンレーザーのアニメーション */
        @keyframes laser-sweep {
            0% { top: 8%; opacity: 0.4; filter: drop-shadow(0 0 1px rgba(239, 68, 68, 0.7)); }
            50% { top: 92%; opacity: 1; filter: drop-shadow(0 0 4px rgba(239, 68, 68, 1)) drop-shadow(0 0 8px rgba(239, 68, 68, 0.8)); }
            100% { top: 8%; opacity: 0.4; filter: drop-shadow(0 0 1px rgba(239, 68, 68, 0.7)); }
        }

        .scanning-laser {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background-color: #ef4444;
            z-index: 10;
            animation: laser-sweep 2.2s infinite ease-in-out;
            pointer-events: none;
        }

        /* 筆算エリアのグリッド線スタイル */
        .graph-cell {
            position: relative;
            border-right: 1px solid #bae6fd;
            border-bottom: 1px solid #bae6fd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-select { 
            -webkit-touch-callout: none; 
            user-select: none; 
        }

        /* レシート用紙のデザイン */
        .receipt-paper {
            position: relative; 
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-top: 8px solid #10b981; 
        }

        /* カートリストのスマホ用快適スクロール設定 */
        #cart-list {
            -webkit-overflow-scrolling: touch !important; 
            user-select: auto !important;                
            touch-action: pan-y !important;               
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col bg-slate-50 overflow-hidden no-select">

    <!-- ヘッダー -->
    <header class="bg-emerald-600 text-white p-3 sm:p-4 shadow-md flex justify-between items-center z-10 flex-shrink-0">
        <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">🛒 セルフレジでおかいけいしよう</h1>
        <span class="bg-emerald-800 text-xs px-3 py-1.5 rounded-full font-bold hidden sm:inline">たのしいお買い物＆ひっ算おつり計算</span>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row p-2 sm:p-4 gap-2 sm:gap-4 overflow-hidden h-full min-h-0">

        <section class="w-full lg:flex-1 bg-white rounded-xl shadow-lg flex flex-col p-3 sm:p-4 border border-emerald-100 flex-shrink-0 lg:min-h-0">
            <div class="flex justify-between items-center mb-1">
                <h2 class="text-lg sm:text-xl font-bold text-gray-700 flex items-center gap-1.5">
                    <span>📸</span> バーコードをスキャン！
                </h2>
                <!-- はじめる・おやすみ切り替えトグルボタン -->
                <button id="camera-toggle-btn" onclick="toggleCameraActive()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-1 px-3 rounded-full text-xs sm:text-sm active:scale-95 transition shadow-sm flex items-center gap-1">
                    ▶ はじめる
                </button>
            </div>
            
            <!-- カメラ映像のコンテナ -->
            <div class="relative w-full h-[35vh] sm:h-[40vh] lg:h-auto lg:flex-1 bg-slate-900 rounded-lg overflow-hidden flex flex-col items-center justify-center border-2 border-slate-700 mt-2">
                <div id="scanner-container" class="absolute inset-0 w-full h-full flex items-center justify-center overflow-hidden bg-black">
                    <div id="reader" class="w-full h-full relative flex items-center justify-center"></div>
                    
                    <!-- 自作のおしゃれなスキャン枠（二重になりません） -->
                    <div class="absolute inset-0 z-10 pointer-events-none flex items-center justify-center overflow-hidden">
                        <div class="relative w-[80%] max-w-[320px] aspect-[5/3] rounded-lg shadow-[0_0_0_9999px_rgba(15,23,42,0.65)] flex items-center justify-center border border-white/20">
                            <div class="absolute top-0 left-0 w-6 h-6 border-t-4 border-l-4 border-white rounded-tl-sm"></div>
                            <div class="absolute top-0 right-0 w-6 h-6 border-t-4 border-r-4 border-white rounded-tr-sm"></div>
                            <div class="absolute bottom-0 left-0 w-6 h-6 border-b-4 border-l-4 border-white rounded-bl-sm"></div>
                            <div class="absolute bottom-0 right-0 w-6 h-6 border-b-4 border-r-4 border-white rounded-br-sm"></div>
                            <div class="scanning-laser"></div>
                        </div>
                    </div>
                    
                    <!-- カメラ未起動・エラー時の優しく視覚的なメッセージ -->
                    <div id="camera-fallback-msg" class="absolute inset-0 bg-slate-950/90 text-white flex flex-col items-center justify-center p-6 text-center z-20 pointer-events-none">
                        <span class="text-4xl mb-3">📷</span>
                        <p class="font-bold mb-1">カメラがおやすみ中だよ</p>
                        <p class="text-xs text-slate-400">右上の「▶ はじめる」ボタンを押してね！</p>
                    </div>
                </div>
            </div>

            <!-- 下部：3カラムの均等配置コントロールボタン (image_2aa2e5.jpgに完全準拠) -->
            <div class="mt-2 sm:mt-3 flex gap-2 justify-between items-center w-full">
                <button onclick="triggerMockScan()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-bold py-2.5 px-2 rounded-lg shadow active:scale-95 transition text-xs sm:text-sm md:text-base">
                    ⚡ ぴっ!(テスト)
                </button>
                <button onclick="toggleCameraFacing()" class="flex-1 bg-slate-600 hover:bg-slate-700 text-white font-bold py-2.5 px-2 rounded-lg shadow active:scale-95 transition text-xs sm:text-sm md:text-base flex items-center justify-center gap-1">
                    📷 切り替え
                </button>
                <button onclick="clearCart()" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-bold py-2.5 px-2 rounded-lg shadow active:scale-95 transition text-xs sm:text-sm md:text-base flex items-center justify-center gap-1">
                    🧹 からにする
                </button>
            </div>
        </section>

        <!-- 右側：おかいあげ商品カートゾーン -->
        <section class="flex-1 bg-white rounded-xl shadow-lg flex flex-col p-3 sm:p-4 min-h-0 border border-emerald-100">
            <h2 class="text-lg sm:text-xl font-bold mb-2 sm:mb-3 text-gray-700 border-b-2 border-gray-100 pb-1 sm:pb-2 flex items-center gap-1.5 flex-shrink-0">
                <span>📋</span> おかいあげ商品
            </h2>
            
            <!-- スクロール可能なカート領域（ul自体をスクロールコンテナに指定して常に自動で最下部へスクロールさせる） -->
            <div class="flex-1 mb-2 sm:mb-4 pr-1 flex flex-col min-h-0 overflow-hidden">
                <ul id="cart-list" class="flex-1 overflow-y-auto space-y-2 pb-2 scroll-smooth">
                    <li id="cart-placeholder" class="text-gray-400 text-center mt-6 sm:mt-12 font-kyokasho text-sm sm:text-base">おかいもの を はじめよう！</li>
                </ul>
            </div>

            <!-- 合計金額とお会計手続き -->

                <div class="flex justify-between items-center mb-2 sm:mb-3">
                    <span class="text-sm sm:text-lg font-bold text-gray-600">お買い上げ点数:</span>
                    <span id="total-count" class="text-lg sm:text-xl font-bold">0 点</span>
                </div>
                <div class="flex justify-between items-center mb-3 sm:mb-4">
                    <span class="text-sm sm:text-lg font-bold text-gray-600">ごうけい金額:</span>
                    <span class="text-2xl sm:text-3xl font-black text-rose-600"><span id="total-price">0</span> 円</span>
                </div>
                <button id="checkout-btn" onclick="openPaymentModal()" disabled class="w-full bg-emerald-500 text-white font-black py-3 sm:py-4 rounded-xl text-lg sm:text-xl shadow-lg hover:bg-emerald-600 active:scale-95 transition disabled:bg-slate-300">
                    💳 おかいけいする
                </button>
            </div>
        </section>
    </main>

    <!-- おつり計算モーダル -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4">
        <div class="bg-sky-50 rounded-2xl shadow-2xl max-w-4xl w-full flex flex-col overflow-hidden border-4 border-sky-400 h-[90vh] md:h-auto">
            
            <div class="bg-sky-500 text-white p-3 sm:p-4 text-center shrink-0">
                <h3 class="text-xl sm:text-2xl font-bold">おつりを けいさん しよう！</h3>
                <p id="payment-info" class="text-sm sm:text-lg mt-1 font-semibold"></p>
            </div>

            <div class="flex-1 flex flex-col md:flex-row p-3 sm:p-4 gap-4 overflow-y-auto">
                <!-- 筆算エリア -->
                <div class="flex flex-col gap-2 w-full max-w-[340px] mx-auto shrink-0">
                    <div class="relative w-full flex items-center justify-between bg-white px-3 py-1.5 rounded-lg shadow-sm border border-sky-100">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-500 font-bold">✍️ メモ:</span>
                            <button onclick="setPenColor('#ef4444')" id="btn-pen-red" class="w-6 h-6 rounded-full bg-red-500 border-2 border-white ring-2 ring-red-500"></button>
                            <button onclick="setPenColor('#3b82f6')" id="btn-pen-blue" class="w-6 h-6 rounded-full bg-blue-500 border-2 border-white"></button>
                            <button onclick="setPenColor('#1e293b')" id="btn-pen-black" class="w-6 h-6 rounded-full bg-slate-800 border-2 border-white"></button>
                        </div>
                        <button onclick="clearCanvas()" class="text-xs bg-amber-100 text-amber-800 font-bold py-1 px-2.5 rounded hover:bg-amber-200">🧹 消す</button>
                    </div>

                    <!-- 方眼紙風のひっ算ノート -->
                    <div class="relative w-full bg-white rounded-xl shadow-lg border-2 border-sky-300 p-2 overflow-hidden">
                        <div class="relative w-full" id="canvas-container">
                            <div id="calculation-grid-container"></div>
                            <canvas id="memo-canvas" class="absolute top-0 left-0 w-full h-full cursor-crosshair z-20 touch-none"></canvas>
                        </div>
                        <div id="answer-grid-container"></div>
                    </div>
                </div>

                <!-- テンキー入力 -->
                <div class="flex-1 flex flex-col justify-center items-center max-w-sm mx-auto w-full shrink-0 mt-4 md:mt-0">
                    <div class="grid grid-cols-3 gap-2 w-full font-kyokasho">
                        <button onclick="pressKey(7)" class="bg-white p-4 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">7</button>
                        <button onclick="pressKey(8)" class="bg-white p-4 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">8</button>
                        <button onclick="pressKey(9)" class="bg-white p-4 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">9</button>
                        <button onclick="pressKey(4)" class="bg-white p-4 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">4</button>
                        <button onclick="pressKey(5)" class="bg-white p-4 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">5</button>
                        <button onclick="pressKey(6)" class="bg-white p-4 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">6</button>
                        <button onclick="pressKey(1)" class="bg-white p-4 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">1</button>
                        <button onclick="pressKey(2)" class="bg-white p-4 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">2</button>
                        <button onclick="pressKey(3)" class="bg-white p-4 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">3</button>
                        <button onclick="pressKey('C')" class="bg-rose-100 p-4 sm:p-5 rounded-2xl text-lg sm:text-xl font-bold active:scale-95 transition">消す</button>
                        <button onclick="pressKey(0)" class="bg-white p-4 sm:p-5 rounded-2xl shadow-md border-2 text-2xl sm:text-3xl font-black active:scale-95 transition">0</button>
                        <button onclick="pressKey('BS')" class="bg-amber-100 p-4 sm:p-5 rounded-2xl text-lg sm:text-xl font-bold active:scale-95 transition">⬅戻る</button>
                    </div>
                    
                    <div class="mt-4 w-full flex flex-col gap-3">
                        <div class="flex gap-2 w-full" id="action-buttons-row">
                            <button onclick="closePaymentModal()" class="flex-1 bg-slate-400 text-white font-bold py-3 rounded-xl hover:bg-slate-500 text-sm active:scale-95 transition">やめる</button>
                            <button onclick="showAnswerAutomatic()" class="flex-1 bg-sky-500 text-white font-bold py-3 rounded-xl hover:bg-sky-600 text-sm active:scale-95 transition">💡おつりをみる</button>
                            <button onclick="checkAnswer()" class="flex-1 bg-amber-500 text-white font-black py-3 rounded-xl hover:bg-amber-600 text-sm shadow-md active:scale-95 transition">答え合わせ</button>
                        </div>
                        <button id="show-receipt-btn" onclick="showReceipt()" class="hidden w-full bg-emerald-500 text-white font-black py-4 rounded-xl text-xl shadow-lg hover:bg-emerald-600 animate-pulse">
                            🧾 レシートをみる！
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- レシートモーダル（お買い上げ商品が多くなった場合に背景全体が縦スクロールできるように設計） -->

        <div class="flex flex-col items-center max-w-sm w-full h-auto flex-shrink-0">
            <!-- レシート用紙（中身に応じて伸びる） -->
            <div class="receipt-paper w-full bg-white text-black p-6 font-bold text-sm h-auto flex-shrink-0">
                <div class="absolute top-4 right-4 border-4 border-rose-600 text-rose-600 text-xs font-black px-2 py-1 rounded-lg rotate-12 bg-white/95 shadow-sm z-10">💮 よくできました</div>
                <div class="text-center mb-4 mt-2 pr-20 relative">
                    <div class="text-lg font-black text-black font-kyokasho">🌻 さくらマーケット</div>
                    <div class="text-[11px] text-slate-900 font-bold">おつり計算 セルフレジ</div>
                </div>
                <div class="border-b border-dashed border-slate-500 my-2"></div>
                
                <div class="flex justify-between text-[11px] text-slate-900 px-1 font-bold">

                <div class="flex justify-between text-[11px] text-slate-900 px-1 mt-0.5 font-bold">

                    <span>取引No. <span id="receipt-tx-no"></span></span>
                </div>

                <div class="border-b border-dashed border-slate-500 my-2"></div>
                <!-- 商品リスト（縦にスクロールさせず、そのまま下に伸びるように設定） -->
                <ul id="receipt-items-list" class="space-y-1 my-3 text-xs text-black font-bold h-auto overflow-visible"></ul>
                <div class="border-b border-dashed border-slate-500 my-2"></div>
                
                <div class="space-y-2 font-black mt-2 text-black text-base">
                    <div class="flex justify-between text-base border-b border-slate-500 pb-1">
                        <span>合計（内税）</span>
                        <span><span id="receipt-total-cost">0</span> 円</span>
                    </div>
                    <div class="flex justify-between pt-1 text-base font-black text-black">
                        <span>おあずかり</span>
                        <span><span id="receipt-paid-amount">0</span> 円</span>
                    </div>
                    <div class="flex justify-between text-base border-t border-slate-500 pt-1 mt-1 font-black text-black">
                        <span>おつり</span>
                        <span><span id="receipt-change-amount">0</span> 円</span>
                    </div>
                </div>

                <div class="flex justify-center items-center gap-0.5 mt-6 mb-2 h-8 opacity-90">
                    <div class="w-1 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div><div class="w-1 h-full bg-slate-950"></div>
                    <div class="w-3 h-full bg-slate-950"></div><div class="w-1 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div>
                </div>
                <div class="text-center text-[11px] text-slate-900 font-bold">
                    <p>ありがとうございました！</p>
                </div>
            </div>
            
            <!-- レシートの外に配置し、レシートが長くなっても下部スクロールで出てくるように配置 -->
            <button onclick="resetAppAndCloseSuccess()" class="w-full mt-6 bg-amber-500 hover:bg-amber-600 text-white font-black py-4 rounded-xl text-xl shadow-lg transition active:scale-95 flex-shrink-0">
                つぎのお買い物へ！
            </button>
        </div>
    </div>

    <script>

            { name: "ポテトチップス (🥔)", price: 119 }, { name: "チョコレート (🍫)", price: 108 },
            { name: "キャンディ (🍬)", price: 88 }, { name: "クッキー (🍪)", price: 158 },
            { name: "ショートケーキ (🍰)", price: 350 }, { name: "ドーナツ (🍩)", price: 120 },
            { name: "アイスクリーム (🍨)", price: 140 }, { name: "プリン (🍮)", price: 110 },
            { name: "ポップコーン (🍿)", price: 160 }, { name: "ハチミツ (🍯)", price: 450 },
            { name: "ようかん (🍡)", price: 130 }, { name: "せんべい (🍘)", price: 120 },
            { name: "ホットケーキ (🥞)", price: 250 }, { name: "ワッフル (🧇)", price: 180 },
            { name: "パフェ (🍧)", price: 380 },
            // 飲み物 (11)
            { name: "オレンジジュース (🍹)", price: 156 }, { name: "りんごジュース (🧃)", price: 105 },
            { name: "ぎゅうにゅう (🥛)", price: 198 }, { name: "おちゃ (🍵)", price: 98 },
            { name: "コーヒー (☕)", price: 120 }, { name: "タピオカ (🧋)", price: 350 },
            { name: "ソーダ (🥤)", price: 110 }, { name: "ミネラルウォーター (💧)", price: 85 },
            { name: "レモネード (🥤)", price: 180 }, { name: "ココア (☕)", price: 140 },
            { name: "トマトジュース (🍅)", price: 160 },
            // 乳製品・その他調味料 (12)
            { name: "チーズ (🧀)", price: 298 }, { name: "バター (🧈)", price: 350 },
            { name: "ヨーグルト (🍧)", price: 148 }, { name: "マヨネーズ (🍾)", price: 218 },
            { name: "ケチャップ (🥫)", price: 188 }, { name: "おしお (🧂)", price: 98 },
            { name: "オリーブオイル (🫒)", price: 498 }, { name: "ジャム (🍓)", price: 230 },
            { name: "トウモロコシ (🌽)", price: 120 }, { name: "きのこ (🍄)", price: 98 },
            { name: "なっとう (🥣)", price: 88 }, { name: "とうふ (⬜)", price: 78 }
        ];

        let cart = [];
        let html5QrcodeScanner = null;
        let currentFacingMode = "environment"; // 背面カメラを初期設定
        let solvedCount = 0; 
        let isScannerTransitioning = false;
        let isSolved = false;
        let synth = null;
        let totalAmount = 0, paidAmount = 0, changeAmount = 0;
        let currentFocusIndex = 0;
        let userAnswers = ["", "", "", ""];

        function initAudio() {
            if (!synth) {
                synth = new Tone.Synth({
                    oscillator: { type: "sine" },
                    envelope: { attack: 0.005, decay: 0.1 }
                }).toDestination();
            }
            if (Tone.context.state !== 'running') {
                Tone.context.resume();
            }
        }

        // バーコードの一貫性を100%保証するハッシュマッピング（75個すべて）
        function getProductFromBarcode(barcode) {
            let hash = 2166136261; 
            for (let i = 0; i < barcode.length; i++) {
                hash ^= barcode.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            const index = Math.abs(hash) % dummyProducts.length;
            return dummyProducts[index];
        }

        window.addEventListener("DOMContentLoaded", () => {
            renderCart();
            setupMemoCanvas();
        });

        // はじめる・おやすみボタンのトグルアクション
        async function toggleCameraActive() {
            const btn = document.getElementById("camera-toggle-btn");
            if (html5QrcodeScanner && html5QrcodeScanner.getState() === 2) {
                // カメラ停止処理（おやすみ）
                cleanupScanner();
                btn.innerHTML = "▶ はじめる";
                btn.className = "bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-1 px-3 rounded-full text-xs sm:text-sm active:scale-95 transition shadow-sm flex items-center gap-1";
                document.getElementById("camera-fallback-msg").classList.remove("hidden");
            } else {
                // カメラ起動処理
                btn.innerHTML = "⌛ きどうちゅう...";
                btn.disabled = true;
                const success = await startScanning(currentFacingMode);
                btn.disabled = false;
                if (success) {
                    btn.innerHTML = "■ おやすみ";
                    btn.className = "bg-rose-500 hover:bg-rose-600 text-white font-bold py-1 px-3 rounded-full text-xs sm:text-sm active:scale-95 transition shadow-sm flex items-center gap-1";
                } else {
                    btn.innerHTML = "▶ はじめる";
                    btn.className = "bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-1 px-3 rounded-full text-xs sm:text-sm active:scale-95 transition shadow-sm flex items-center gap-1";
                }
            }
        }

        // カメラとストリームのクリーンアップ
        function cleanupScanner() {
            if (html5QrcodeScanner) {
                try { html5QrcodeScanner.stop(); } catch(e){}
                try { html5QrcodeScanner.clear(); } catch(e){}
                html5QrcodeScanner = null;
            }
            document.getElementById("reader").innerHTML = "";
        }

        // カメラ接続とスキャンの開始
        async function startScanning(facingMode) {
            if (isScannerTransitioning) return false;
            isScannerTransitioning = true;

            cleanupScanner();

            try {
                html5QrcodeScanner = new Html5Qrcode("reader");

                // 読み取り範囲の制限を解除し、スマホの高画質カメラの映像全体から爆速で検知させる
                const config = {
                    fps: 15
                };

                await html5QrcodeScanner.start(
                    { facingMode: facingMode },
                    config,
                    onScanSuccessInternal,
                    onScanErrorInternal
                );

                // インカメラ起動時の鏡像クラス調整
                const readerDiv = document.getElementById("reader");
                const videoEl = readerDiv.querySelector("video");
                
                // 動的にインカメラ判定（ラベル情報やFacing設定を精査）
                let isUserFacing = (facingMode === "user");
                if (videoEl && videoEl.srcObject) {
                    const track = videoEl.srcObject.getVideoTracks()[0];
                    if (track) {
                        const settings = track.getSettings();
                        const label = track.label.toLowerCase();
                        if (settings.facingMode === "user" || label.includes("front") || label.includes("webcam") || label.includes("facetime")) {
                            isUserFacing = true;
                        }
                    }
                }

                if (isUserFacing) {
                    readerDiv.classList.add("mirror-video");
                } else {
                    readerDiv.classList.remove("mirror-video");
                }

                // カメラ起動成功後、ブラウザ制限による自動再生停止を回避する強制プレイ
                setTimeout(() => {
                    if (videoEl && videoEl.paused) {
                        videoEl.play().catch(err => console.warn("Video auto-play forced:", err));
                    }
                }, 300);

                document.getElementById("camera-fallback-msg").classList.add("hidden");
                isScannerTransitioning = false;
                return true;

            } catch (err) {
                console.warn("Primary camera start failed, trying fallback to user camera...", err);
                
                // 背面カメラがない場合のインカメラへの自動フォールバック
                if (facingMode === "environment") {
                    isScannerTransitioning = false;
                    currentFacingMode = "user";
                    return await startScanning("user");
                }

                document.getElementById("camera-fallback-msg").classList.remove("hidden");
                isScannerTransitioning = false;
                return false;
            }
        }

        let lastScanTime = 0;
        function onScanSuccessInternal(decodedText) {
            const now = Date.now();
            const cleanCode = decodedText.replace(/[^0-9]/g, ''); 
            if (cleanCode.length < 8) return; 
            if (now - lastScanTime < 2200) return; // 重複スキャンの防止
            
            lastScanTime = now;
            addToCart(getProductFromBarcode(cleanCode));
        }

        function onScanErrorInternal() {}

        // カメラトグル（内・外）の切り替え
        async function toggleCameraFacing() {
            if (isScannerTransitioning) return;
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            
            const btn = document.getElementById("camera-toggle-btn");
            if (html5QrcodeScanner && html5QrcodeScanner.getState() === 2) {
                btn.innerHTML = "⌛ きりかえちゅう...";
                await startScanning(currentFacingMode);
                btn.innerHTML = "■ おやすみ";
            }
        }

        // 模擬バーコードを生成し、75種類から一意でマッピング（完全に同じバーコードなら常に同じ商品が登録される）
        function triggerMockScan() {
            const mockBarcode = (10000000 + Math.floor(Math.random() * 90000000)).toString();
            addToCart(getProductFromBarcode(mockBarcode));
        }

        function addToCart(product) {
            initAudio();
            if (synth) synth.triggerAttackRelease("D6", "32n");

            const container = document.getElementById("scanner-container");
            container.classList.add("ring-8", "ring-emerald-400");
            setTimeout(() => container.classList.remove("ring-8", "ring-emerald-400"), 150);

            cart.push({ ...product, id: Date.now() + Math.random() });
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById("cart-list");
            list.innerHTML = "";
            let total = 0;
            
            if (cart.length === 0) {
                list.innerHTML = `<li id="cart-placeholder" class="text-gray-400 text-center mt-6 sm:mt-12 font-kyokasho text-sm sm:text-base">おかいもの を はじめよう！</li>`;
            } else {
                cart.forEach(item => {
                    total += item.price;
                    const li = document.createElement("li");
                    li.className = "flex justify-between items-center bg-emerald-50 p-2.5 sm:p-3 rounded-lg border border-emerald-100";
                    li.innerHTML = `
                        <span class="font-bold text-gray-800 text-sm sm:text-base font-kyokasho">${item.name}</span>
                        <div class="flex items-center gap-2 sm:gap-3">
                            <span class="font-bold text-emerald-700 text-sm sm:text-base font-kyokasho">${item.price} 円</span>
                            <button onclick="removeItem(${item.id})" class="bg-rose-100 text-rose-700 text-xs px-2.5 py-1 rounded-lg font-bold hover:bg-rose-200 active:scale-95 transition">取消</button>
                        </div>
                    `;
                    list.appendChild(li);
                });
            }

            document.getElementById("total-count").innerText = cart.length + " 点";
            document.getElementById("total-price").innerText = total.toLocaleString();
            document.getElementById("checkout-btn").disabled = cart.length === 0;

            // 新しい商品が一番下に滑らかに追加されるスクロール処理（自動スクロール）
            setTimeout(() => { 
                list.scrollTop = list.scrollHeight; 
            }, 50);
        }

        function removeItem(id) { 
            cart = cart.filter(i => i.id !== id); 
            renderCart(); 
        }
        
        function clearCart() { 
            cart = []; 
            renderCart(); 
        }

        function getOptimalPayment(total) {
            const base = Math.ceil(total / 1000) * 1000;
            if (solvedCount < 1) return base === total ? base + 1000 : base;
            const rand = Math.random();
            if (rand < 0.5) {
                const hasu = total % 100;
                if (hasu > 0 && (base + hasu) > total) return base + hasu;
            }
            return (total < 4000 && Math.random() > 0.6) ? 5000 : (base === total ? base + 1000 : base);
        }

        function openPaymentModal() {
            isSolved = false; 
            document.getElementById("action-buttons-row").classList.remove("hidden");
            document.getElementById("show-receipt-btn").classList.add("hidden");

            totalAmount = cart.reduce((s, i) => s + i.price, 0);
            paidAmount = getOptimalPayment(totalAmount);
            changeAmount = paidAmount - totalAmount;
            
            document.getElementById("payment-info").innerText = `ごうけい ${totalAmount} 円。おさいふから ${paidAmount} 円 だしました！`;
            renderGrid();
            document.getElementById("payment-modal").classList.remove("hidden");
            
            if (html5QrcodeScanner && html5QrcodeScanner.getState() === 2) { 
                try { html5QrcodeScanner.pause(true); } catch(e){} 
            }
            setTimeout(resizeCanvas, 100);
        }

        function closePaymentModal() { 
            document.getElementById("payment-modal").classList.add("hidden"); 
            if (html5QrcodeScanner && html5QrcodeScanner.getState() === 3) { 
                try { html5QrcodeScanner.resume(); } catch(e){} 
            }
        }

        function resetAppAndCloseSuccess() { 
            document.getElementById("success-modal").classList.add("hidden"); 
            clearCart(); 
            if (html5QrcodeScanner && html5QrcodeScanner.getState() === 3) { 
                try { html5QrcodeScanner.resume(); } catch(e){} 
            }
        }

        // 筆算グリッドのレンダリング
        function renderGrid() {
            const cols = paidAmount >= 10000 ? 6 : 5;
            const container = document.getElementById("calculation-grid-container");
            
            // 動的クラス問題を回避するためのCSSカスタムグリッド構築
            container.innerHTML = `<div id="calculation-grid" class="grid border-t border-l border-sky-200" style="grid-template-columns: repeat(${cols}, minmax(0, 1fr));"></div>`;
            const grid = container.firstChild;

            const paidStr = paidAmount.toString().padStart(cols, " ");
            const totalStr = totalAmount.toString().padStart(cols - 1, " ");

            // 上部の余裕あるメモ欄を生成
            for(let i=0; i<cols; i++) grid.innerHTML += `<div class="graph-cell h-24 sm:h-32 bg-sky-50/30"></div>`; 
            for(let i=0; i<cols; i++) grid.innerHTML += `<div class="graph-cell h-16 sm:h-20 text-3xl sm:text-4xl font-bold font-kyokasho text-slate-800">${paidStr[i] !== " " ? paidStr[i] : ""}</div>`; 
            grid.innerHTML += `<div class="graph-cell h-16 sm:h-20 text-4xl sm:text-5xl font-black text-blue-600 font-kyokasho">－</div>`; 
            for(let i=0; i<cols-1; i++) grid.innerHTML += `<div class="graph-cell h-16 sm:h-20 text-3xl sm:text-4xl font-bold font-kyokasho text-slate-800">${totalStr[i] !== " " ? totalStr[i] : ""}</div>`;
            grid.innerHTML += `<div class="h-1.5 bg-slate-800 my-1" style="grid-column: span ${cols} / span ${cols};"></div>`; 
            for(let i=0; i<cols; i++) grid.innerHTML += `<div class="graph-cell h-12 sm:h-16 bg-sky-50/10"></div>`; 

            const ansContainer = document.getElementById("answer-grid-container");
            ansContainer.innerHTML = `<div class="grid mt-2" style="grid-template-columns: repeat(${cols}, minmax(0, 1fr));"><div class="flex items-center justify-center text-3xl sm:text-4xl font-black text-slate-400">=</div></div>`;
            const ansGrid = ansContainer.firstChild;
            if(cols===6) ansGrid.innerHTML += `<div class="m-1 h-16 sm:h-20"></div>`;
            
            for(let i=3; i>=0; i--) {
                ansGrid.innerHTML += `<div onclick="focusDigit(${i})" id="ans-box-${i}" class="m-1 h-16 sm:h-20 bg-amber-50 border-2 border-slate-300 rounded-lg flex items-center justify-center text-3xl sm:text-4xl font-black text-amber-700 cursor-pointer transition font-kyokasho"></div>`;
            }
            
            userAnswers = ["","","",""]; 
            focusDigit(0);
        }

        function focusDigit(idx) {
            currentFocusIndex = idx;
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-box-${i}`);
                if(b) {
                    b.className = (i===idx) 
                        ? "m-1 h-16 sm:h-20 bg-yellow-100 border-4 border-amber-400 rounded-lg flex items-center justify-center text-3xl sm:text-4xl font-black text-amber-800 scale-105 font-kyokasho" 
                        : "m-1 h-16 sm:h-20 bg-amber-50 border-2 border-slate-300 rounded-lg flex items-center justify-center text-3xl sm:text-4xl font-black text-amber-700 cursor-pointer font-kyokasho";
                }
            }
        }

        function pressKey(k) {
            if (isSolved) return; 
            initAudio();
            if(typeof k === 'number') {
                userAnswers[currentFocusIndex] = k.toString();
                document.getElementById(`ans-box-${currentFocusIndex}`).innerText = k;
                if(currentFocusIndex < 3) focusDigit(currentFocusIndex + 1);
            } else if(k === 'BS') {
                userAnswers[currentFocusIndex] = ""; 
                document.getElementById(`ans-box-${currentFocusIndex}`).innerText = "";
                if(currentFocusIndex > 0) focusDigit(currentFocusIndex - 1);
            } else if(k === 'C') {
                userAnswers = ["","","",""]; 
                for(let i=0; i<4; i++) document.getElementById(`ans-box-${i}`).innerText = ""; 
                focusDigit(0);
            }
        }

        function playCorrectChime() {
            if (synth) {
                const now = Tone.now();
                synth.triggerAttackRelease("C5", "8n", now);
                synth.triggerAttackRelease("E5", "8n", now + 0.1);
                synth.triggerAttackRelease("G5", "8n", now + 0.2);
                synth.triggerAttackRelease("C6", "4n", now + 0.3);
            }
        }

        function playIncorrectChime() {
            if (synth) {
                const now = Tone.now();
                synth.triggerAttackRelease("A3", "8n", now);
                synth.triggerAttackRelease("A3", "8n", now + 0.15);
            }
        }

        function checkAnswer() {
            if (isSolved) return;
            let s = ""; 
            for(let i=3; i>=0; i--) s += userAnswers[i] || (s===""?"":"0");
            
            if(parseInt(s || "0") === changeAmount) {
                isSolved = true;
                playCorrectChime();
                solvedCount++; 
                showReceiptButton();
            } else {
                playIncorrectChime();
            }
        }

        function showAnswerAutomatic() {
            if (isSolved) return;
            isSolved = true;
            const strChange = changeAmount.toString();
            userAnswers = ["", "", "", ""];
            for(let i=0; i<4; i++) document.getElementById(`ans-box-${i}`).innerText = "";
            let strIdx = strChange.length - 1;
            for(let i=0; i<strChange.length; i++) {
                userAnswers[i] = strChange[strIdx - i];
                document.getElementById(`ans-box-${i}`).innerText = userAnswers[i];
            }
            currentFocusIndex = -1;
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-box-${i}`);
                if (!userAnswers[i]) b.className = "m-1 h-16 sm:h-20 bg-amber-50 border-2 border-slate-300 rounded-lg flex items-center justify-center text-3xl sm:text-4xl font-black text-amber-700 font-kyokasho";
            }
            playCorrectChime();
            showReceiptButton();
        }

        function showReceiptButton() {
            document.getElementById("action-buttons-row").classList.add("hidden"); 
            document.getElementById("show-receipt-btn").classList.remove("hidden");
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-box-${i}`);
                if (userAnswers[i]) {
                    b.classList.remove("bg-yellow-100", "border-amber-400", "text-amber-800", "bg-amber-50", "text-amber-700", "border-slate-300");
                    b.classList.add("bg-sky-100", "border-4", "border-sky-400", "text-sky-800", "scale-105"); 
                }
            }
        }

        // レシート印刷ダイアログの表示
        function showReceipt() {
            document.getElementById("payment-modal").classList.add("hidden");
            const d = new Date(); 
            document.getElementById("receipt-date").innerText = `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
            document.getElementById("receipt-tx-no").innerText = Math.floor(Math.random() * 9000) + 1000;
            
            const list = document.getElementById("receipt-items-list"); 
            list.innerHTML = "";
            cart.forEach(i => {
                list.innerHTML += `<li class="flex justify-between text-black font-bold font-kyokasho"><span>${i.name}</span><span>${i.price} 円</span></li>`;
            });
            
            document.getElementById("receipt-total-cost").innerText = totalAmount.toLocaleString();
            document.getElementById("receipt-paid-amount").innerText = paidAmount.toLocaleString();
            document.getElementById("receipt-change-amount").innerText = changeAmount.toLocaleString();
            
            document.getElementById("success-modal").classList.remove("hidden");
        }

        let canvas, ctx, isDrawing = false, penColor = '#ef4444';
        function setupMemoCanvas() {
            canvas = document.getElementById("memo-canvas"); 
            if (!canvas) return;
            ctx = canvas.getContext("2d");
            
            const draw = (e) => {
                if(!isDrawing || !ctx) return;
                const r = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                ctx.lineTo(x, y); 
                ctx.strokeStyle = penColor; 
                ctx.lineWidth = 4; 
                ctx.lineCap = "round"; 
                ctx.stroke();
            };
            
            canvas.onmousedown = (e) => { 
                isDrawing = true; ctx.beginPath(); 
                const r = canvas.getBoundingClientRect(); 
                ctx.moveTo(e.clientX-r.left, e.clientY-r.top); 
            };
            canvas.onmousemove = draw;
            window.onmouseup = () => isDrawing = false;
            
            canvas.addEventListener("touchstart", (e) => { 
                isDrawing = true; ctx.beginPath(); 
                const r = canvas.getBoundingClientRect(); 
                ctx.moveTo(e.touches[0].clientX-r.left, e.touches[0].clientY-r.top); 
                e.preventDefault(); 
            }, { passive: false });
            canvas.addEventListener("touchmove", (e) => { draw(e); e.preventDefault(); }, { passive: false });
            canvas.addEventListener("touchend", () => isDrawing = false);
        }
        
        function resizeCanvas() { 
            const c = document.getElementById("canvas-container"); 
            if (c && canvas && c.offsetWidth > 0) {
                canvas.width = c.offsetWidth; canvas.height = c.offsetHeight; 
            } else setTimeout(resizeCanvas, 50);
        }

        function setPenColor(color) {
            penColor = color;
            document.getElementById("btn-pen-red").className = color === '#ef4444' ? "w-6 h-6 rounded-full bg-red-500 border-2 border-white ring-2 ring-red-500" : "w-6 h-6 rounded-full bg-red-500 border-2 border-white";
            document.getElementById("btn-pen-blue").className = color === '#3b82f6' ? "w-6 h-6 rounded-full bg-blue-500 border-2 border-white ring-2 ring-blue-500" : "w-6 h-6 rounded-full bg-blue-500 border-2 border-white";
            document.getElementById("btn-pen-black").className = color === '#1e293b' ? "w-6 h-6 rounded-full bg-slate-800 border-2 border-white ring-2 ring-slate-800" : "w-6 h-6 rounded-full bg-slate-800 border-2 border-white";
        }

        function clearCanvas() { 
            if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height); 
        }
    </script>
