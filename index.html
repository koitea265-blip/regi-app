<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>セルフレジでおかいけいしよう</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html5-qrcode 安定稼働バージョン -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <!-- Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body, button, input, p, h1, h2, h3, h4 {
            font-family: 'M PLUS Rounded 1c', "Hiragino Maru Gothic ProN", sans-serif;
        }

        /* 筆算の数字は教科書体フォントを適用 */
        .font-kyokasho {
            font-family: "UD Digi Kyokasho NK-R", "UD デジタル教科書体 NK-R", "UD Digi Kyokasho NP-R", "UD デジタル教科書体 NP-R", "UD デジタル教科書体", "游教科書体", "YuMincho", "Yu Mincho", "Hiragino Mincho ProN", serif !important;
        }

        /* 映像コンテナのベーススタイル */
        #reader {
            border: none !important;
            background-color: #000000 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            width: 100% !important;
            height: 100% !important;
        }

        #reader video {
            border-radius: 0.5rem;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: cover;
        }
        
        /* PCの前カメラ等の直感的な鏡像対応 */
        .mirror-video video {
            transform: scaleX(-1) !important;
        }

        #reader__scan_region img,
        #reader__dashboard_section_csr span, 
        #reader__dashboard_section_csr button,
        #reader__dashboard_section_swaplink {
            display: none !important;
        }
        
        div[style*="background-color: rgba(0, 0, 0, 0.48)"],
        div[style*="background-color:rgba(0, 0, 0, 0.48)"] {
            display: none !important;
        }

        /* html5-qrcodeが自動生成するスキャン判定枠(qrbox)のボーダーと背景を完全消去 */
        #reader__scan_region div,
        #reader__scan_region span,
        [id$="qrbox-border"] {
            border: none !important;
            box-shadow: none !important;
            outline: none !important;
        }

        #reader div, #reader td, #reader table {
            border: none !important;
            box-shadow: none !important;
            background: transparent !important;
        }

        /* 赤い読み取りレーザーのアニメーション */
        @keyframes laser-sweep {
            0% { top: 8%; opacity: 0.4; filter: drop-shadow(0 0 1px rgba(239, 68, 68, 0.7)); }
            50% { top: 92%; opacity: 1; filter: drop-shadow(0 0 4px rgba(239, 68, 68, 1)) drop-shadow(0 0 8px rgba(239, 68, 68, 0.8)); }
            100% { top: 8%; opacity: 0.4; filter: drop-shadow(0 0 1px rgba(239, 68, 68, 0.7)); }
        }

        .scanning-laser {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background-color: #ef4444;
            z-index: 10;
            animation: laser-sweep 2.2s infinite ease-in-out;
            pointer-events: none;
        }

        /* 方眼罫線 */
        .graph-cell {
            position: relative;
            border-right: 1px solid #bae6fd;
            border-bottom: 1px solid #bae6fd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .no-select { 
            -webkit-touch-callout: none; 
            user-select: none; 
        }

        /* フラットなリアルレシートのスタイル */
        .receipt-paper {
            position: relative; 
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            border-top: 8px solid #10b981; 
        }

        /* スマホ縦スクロールの解決 */
        #cart-list {
            -webkit-overflow-scrolling: touch !important; 
            user-select: auto !important;                
            touch-action: pan-y !important;               
        }
    </style>
</head>
<body class="h-screen flex flex-col select-none bg-slate-50 no-select overflow-hidden">

    <header class="bg-emerald-600 text-white p-3 sm:p-4 shadow-md flex justify-between items-center z-10 flex-shrink-0">
        <h1 class="text-xl sm:text-2xl font-bold flex items-center gap-2">🛒 セルフレジでおかいけいしよう</h1>
        <span class="bg-emerald-800 text-xs px-3 py-1.5 rounded-full font-bold hidden md:inline">たのしいお買い物＆ひっ算おつり計算</span>
    </header>

    <main class="flex-1 flex flex-col lg:flex-row p-2 sm:p-4 gap-2 sm:gap-4 overflow-hidden h-full min-h-0">
        
        <!-- 左：スキャンエリア (スマホ画面でも潰れないよう高さを十分に確保) -->
        <section class="w-full lg:flex-1 bg-white rounded-xl shadow-lg flex flex-col p-2 sm:p-4 border border-emerald-100 flex-shrink-0 min-h-[300px] lg:h-full lg:min-h-0">
            <div class="flex justify-between items-center mb-1 flex-shrink-0">
                <h2 class="text-sm sm:text-lg lg:text-xl font-bold text-gray-700 flex items-center gap-1.5">
                    <span>📸</span> バーコードをスキャンしよう！
                </h2>
            </div>
            
            <!-- カメラ映像コンテナ (スマホでは高さを200px確保してピントを合わせやすく) -->
            <div class="relative w-full h-[200px] lg:h-auto lg:flex-1 bg-slate-900 rounded-lg overflow-hidden flex flex-col items-center justify-center border border-slate-700 flex-shrink-0 lg:flex-shrink">
                <div id="scanner-container" class="absolute inset-0 w-full h-full flex items-center justify-center overflow-hidden bg-black">
                    <!-- 映像コンテナ -->
                    <div id="reader" class="w-full h-full relative"></div>
                    
                    <!-- 【UI層：バーコード用横長・拡大ガイド枠（スキャンを狙いやすく調整）】 -->
                    <div class="absolute inset-0 z-10 pointer-events-none flex items-center justify-center overflow-hidden">
                        <div class="relative w-[85%] max-w-[420px] h-[90px] lg:h-[130px] rounded-lg shadow-[0_0_0_9999px_rgba(15,23,42,0.65)] flex items-center justify-center border border-white/20">
                            <!-- 四隅の白い枠 -->
                            <div class="absolute top-0 left-0 w-6 h-6 lg:w-8 lg:h-8 border-t-4 border-l-4 border-white rounded-tl-sm"></div>
                            <div class="absolute top-0 right-0 w-6 h-6 lg:w-8 lg:h-8 border-t-4 border-r-4 border-white rounded-tr-sm"></div>
                            <div class="absolute bottom-0 left-0 w-6 h-6 lg:w-8 lg:h-8 border-b-4 border-l-4 border-white rounded-bl-sm"></div>
                            <div class="absolute bottom-0 right-0 w-6 h-6 lg:w-8 lg:h-8 border-b-4 border-r-4 border-white rounded-br-sm"></div>
                            <div class="scanning-laser"></div>
                        </div>
                    </div>
                    
                    <div id="camera-fallback-msg" class="absolute inset-0 bg-slate-950/90 text-white flex flex-col items-center justify-center p-3 text-center z-20 pointer-events-none text-xs sm:text-sm">
                        <span class="text-xl lg:text-3xl mb-1">📷</span>
                        <p class="font-bold">カメラを起動しています...</p>
                    </div>
                </div>
            </div>

            <!-- スマホ対応・テスト用の確実な固定商品スキャンボタン -->
            <div class="mt-2 flex flex-wrap gap-2 justify-between items-center flex-shrink-0">
                <button onclick="triggerMockScan()" class="bg-amber-500 hover:bg-amber-600 text-white font-black py-2 px-4 rounded-lg shadow active:scale-95 transition text-xs sm:text-sm flex items-center gap-1 min-h-[44px]">
                    ⚡ ぴっ！(テスト用)
                </button>
                <div class="flex gap-2">
                    <button onclick="toggleCameraFacing()" class="bg-slate-600 hover:bg-slate-700 text-white font-bold py-2 px-3 text-xs rounded-lg min-h-[44px]">
                        📷 切り替え
                    </button>
                    <button onclick="clearCart()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-3 text-xs rounded-lg min-h-[44px]">
                        からにする
                    </button>
                </div>
            </div>
        </section>

        <!-- 右：商品リスト (お買い上げ商品の表示数を増やすため余白やサイズをコンパクト化) -->
        <section class="flex-1 bg-white rounded-xl shadow-lg flex flex-col p-2.5 sm:p-4 min-h-0 border border-emerald-100">
            <h2 class="text-sm sm:text-lg font-bold mb-1.5 sm:mb-3 text-gray-700 border-b-2 border-gray-100 pb-1 sm:pb-2 flex items-center gap-1.5 flex-shrink-0">
                <span>📋</span> おかいあげ商品
            </h2>
            
            <!-- 【完璧な縦スクロール領域】 -->
            <div id="cart-scroll-area" class="flex-1 min-h-0 overflow-y-auto mb-2 sm:mb-4 pr-1 scroll-smooth touch-pan-y" style="-webkit-overflow-scrolling: touch;">
                <ul id="cart-list" class="space-y-1.5 pb-2">
                    <li id="cart-placeholder" class="text-gray-400 text-center mt-6 sm:mt-12 font-kyokasho text-xs sm:text-sm">おかいもの を はじめよう！</li>
                </ul>
            </div>

            <!-- 合計・購入エリア (スマホでの画面占有を減らすためコンパクトに設計) -->
            <div class="bg-slate-50 p-2 sm:p-4 rounded-xl border border-slate-200 flex-shrink-0 mt-auto">
                <div class="flex justify-between items-center mb-0.5 sm:mb-2">
                    <span class="text-xs sm:text-sm font-bold text-gray-600">お買い上げ点数:</span>
                    <span id="total-count" class="text-xs sm:text-base font-bold">0 点</span>
                </div>
                <div class="flex justify-between items-center mb-1.5 sm:mb-3">
                    <span class="text-xs sm:text-sm font-bold text-gray-600">ごうけい金額:</span>
                    <span class="text-lg sm:text-2xl font-black text-rose-600"><span id="total-price">0</span> 円</span>
                </div>
                <button id="checkout-btn" onclick="openPaymentModal()" disabled class="w-full bg-emerald-500 text-white font-black py-2 sm:py-3.5 rounded-xl text-sm sm:text-lg shadow hover:bg-emerald-600 transition disabled:bg-slate-300 min-h-[44px]">
                    💳 おかいけいする
                </button>
            </div>
        </section>
    </main>

    <!-- おつり計算ひっ算モーダル -->
    <div id="payment-modal" class="hidden fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4">
        <div class="bg-sky-50 rounded-2xl shadow-2xl max-w-4xl w-full flex flex-col overflow-hidden border-4 border-sky-400">
            <div class="bg-sky-500 text-white p-3 sm:p-4 text-center">
                <h3 class="text-xl sm:text-2xl font-bold">おつりを けいさん しよう！</h3>
                <p id="payment-info" class="text-xs sm:text-lg mt-1 font-semibold"></p>
            </div>

            <div class="flex-1 flex flex-col md:flex-row p-4 gap-4 overflow-y-auto max-h-[75vh]">
                <div class="flex flex-col gap-2 w-full max-w-[340px] mx-auto">
                    <div class="relative w-full flex items-center justify-between bg-white px-3 py-1.5 rounded-lg shadow-sm border border-sky-100">
                        <div class="flex items-center gap-2">
                            <span class="text-xs text-gray-500 font-bold">✍️ メモペン:</span>
                            <button onclick="setPenColor('#ef4444')" id="btn-pen-red" class="w-6 h-6 rounded-full bg-red-500 border-2 border-white ring-2 ring-red-500"></button>
                            <button onclick="setPenColor('#3b82f6')" id="btn-pen-blue" class="w-6 h-6 rounded-full bg-blue-500 border-2 border-white"></button>
                            <button onclick="setPenColor('#1e293b')" id="btn-pen-black" class="w-6 h-6 rounded-full bg-slate-800 border-2 border-white"></button>
                        </div>
                        <button onclick="clearCanvas()" class="text-xs bg-amber-100 text-amber-800 font-bold py-1 px-2.5 rounded hover:bg-amber-200 transition min-h-[30px]">🧹 消す</button>
                    </div>

                    <div class="relative w-full bg-white rounded-xl shadow-lg border-2 border-sky-300 p-2 overflow-hidden">
                        <div class="relative w-full" id="canvas-container">
                            <div id="calculation-grid-container"></div>
                            <canvas id="memo-canvas" class="absolute top-0 left-0 w-full h-full cursor-crosshair z-20 touch-none"></canvas>
                        </div>
                        <div id="answer-grid-container"></div>
                    </div>
                </div>

                <div class="flex-1 flex flex-col justify-center items-center max-w-sm mx-auto w-full">
                    <div class="grid grid-cols-3 gap-2 w-full font-kyokasho">
                        <button onclick="pressKey(7)" class="bg-white p-3 sm:p-5 rounded-2xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50 min-h-[50px]">7</button>
                        <button onclick="pressKey(8)" class="bg-white p-3 sm:p-5 rounded-2xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50 min-h-[50px]">8</button>
                        <button onclick="pressKey(9)" class="bg-white p-3 sm:p-5 rounded-2xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50 min-h-[50px]">9</button>
                        <button onclick="pressKey(4)" class="bg-white p-3 sm:p-5 rounded-2xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50 min-h-[50px]">4</button>
                        <button onclick="pressKey(5)" class="bg-white p-3 sm:p-5 rounded-2xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50 min-h-[50px]">5</button>
                        <button onclick="pressKey(6)" class="bg-white p-3 sm:p-5 rounded-2xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50 min-h-[50px]">6</button>
                        <button onclick="pressKey(1)" class="bg-white p-3 sm:p-5 rounded-2xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50 min-h-[50px]">1</button>
                        <button onclick="pressKey(2)" class="bg-white p-3 sm:p-5 rounded-2xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50 min-h-[50px]">2</button>
                        <button onclick="pressKey(3)" class="bg-white p-3 sm:p-5 rounded-2xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50 min-h-[50px]">3</button>
                        <button onclick="pressKey('C')" class="bg-rose-100 p-3 rounded-2xl text-xs sm:text-base font-bold hover:bg-rose-200 min-h-[50px]">ぜんぶ消す</button>
                        <button onclick="pressKey(0)" class="bg-white p-3 sm:p-5 rounded-2xl shadow border-2 text-xl sm:text-3xl font-black hover:bg-slate-50 min-h-[50px]">0</button>
                        <button onclick="pressKey('BS')" class="bg-amber-100 p-3 rounded-2xl text-xs sm:text-base font-bold hover:bg-amber-200 min-h-[50px]">⬅とりけす</button>
                    </div>
                    
                    <div class="mt-4 w-full flex flex-col gap-3">
                        <div class="flex gap-2 w-full" id="action-buttons-row">
                            <button onclick="closePaymentModal()" class="flex-1 bg-slate-400 text-white font-bold py-3 rounded-xl hover:bg-slate-500 text-xs sm:text-sm min-h-[44px]">やめる</button>
                            <button onclick="showAnswerAutomatic()" class="flex-1 bg-sky-500 text-white font-bold py-3 rounded-xl hover:bg-sky-600 text-xs sm:text-sm min-h-[44px]">💡おつりをみる</button>
                            <button onclick="checkAnswer()" class="flex-1 bg-amber-500 text-white font-black py-3 rounded-xl hover:bg-amber-600 text-xs sm:text-sm min-h-[44px]">答え合わせ</button>
                        </div>
                        <button id="show-receipt-btn" onclick="showReceipt()" class="hidden w-full bg-emerald-500 text-white font-black py-3 rounded-xl text-lg shadow hover:bg-emerald-600 animate-pulse min-h-[50px]">
                            🧾 レシートをみる！
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- よくできました！レシートモーダル -->
    <div id="success-modal" class="hidden fixed inset-0 bg-slate-950/80 z-50 overflow-y-auto flex justify-center items-start py-12 px-4">
        <div class="flex flex-col items-center max-w-sm w-full">
            <div class="receipt-paper w-full bg-white text-black p-6 font-bold text-sm">
                <div class="absolute top-4 right-4 border-4 border-rose-600 text-rose-600 text-xs font-black px-2 py-1 rounded-lg rotate-12 bg-white/95 shadow-sm z-10">💮 よくできました</div>
                <div class="text-center mb-4 mt-2 pr-20 relative">
                    <div class="text-lg font-black text-black font-kyokasho">🌻 こどもマーケット さくら店</div>
                    <div class="text-[11px] text-slate-900 font-bold">おつり計算セルフレジ 特訓コーナー</div>
                </div>
                <div class="border-b border-dashed border-slate-500 my-2"></div>
                
                <div class="flex justify-between text-[11px] text-slate-900 px-1 font-bold">
                    <span id="receipt-date"></span>
                    <span>レジ: 001</span>
                </div>
                <div class="flex justify-between text-[11px] text-slate-900 px-1 mt-0.5 font-bold">
                    <span>担 当: 店長</span>
                    <span>取引No. <span id="receipt-tx-no"></span></span>
                </div>

                <div class="border-b border-dashed border-slate-500 my-2"></div>
                <ul id="receipt-items-list" class="space-y-1 my-3 text-xs text-black font-bold"></ul>
                <div class="border-b border-dashed border-slate-500 my-2"></div>
                
                <div class="space-y-2 font-black mt-2 text-black text-base">
                    <div class="flex justify-between text-base border-b border-slate-500 pb-1">
                        <span>合計（内税）</span>
                        <span><span id="receipt-total-cost">0</span> 円</span>
                    </div>
                    <div class="flex justify-between pt-1 text-base font-black text-black">
                        <span>おあずかり</span>
                        <span><span id="receipt-paid-amount">0</span> 円</span>
                    </div>
                    <div class="flex justify-between text-base border-t border-slate-500 pt-1 mt-1 font-black text-black">
                        <span>おつり</span>
                        <span><span id="receipt-change-amount">0</span> 円</span>
                    </div>
                </div>

                <div class="flex justify-center items-center gap-0.5 mt-6 mb-2 h-8 opacity-90">
                    <div class="w-1 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div><div class="w-1 h-full bg-slate-950"></div>
                    <div class="w-3 h-full bg-slate-950"></div><div class="w-1 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div>
                    <div class="w-1 h-full bg-slate-950"></div><div class="w-3 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div>
                    <div class="w-1 h-full bg-slate-950"></div><div class="w-2 h-full bg-slate-950"></div><div class="w-1 h-full bg-slate-950"></div>
                </div>
                <div class="text-center text-[11px] text-slate-900 font-bold">
                    <p>お買い上げありがとうございました！</p>
                </div>
            </div>
            <button onclick="resetAppAndCloseSuccess()" class="w-full mt-6 bg-amber-500 hover:bg-amber-600 text-white font-black py-4 rounded-xl text-xl shadow-lg transition min-h-[50px]">つぎのお買い物へ！</button>
        </div>
    </div>

    <!-- お祝い紙吹雪用の全画面キャンバス -->
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 w-full h-full hidden"></canvas>

        ];

        // 各商品に対して、チェックデジットを計算した確実な一意のバーコードを動的生成
        function assignBarcodes() {
            dummyProducts.forEach((item, index) => {
                const base = "4901234" + index.toString().padStart(5, "0");
                let sum = 0;
                for (let i = 0; i < 12; i++) {
                    const digit = parseInt(base.charAt(i), 10);
                    sum += digit * (i % 2 === 0 ? 1 : 3);
                }
                const checkDigit = (10 - (sum % 10)) % 10;
                item.barcode = base + checkDigit;
            });
        }

        // FNV-1aに準拠した非破壊ハッシュ関数で「本物のバーコード」を75個のダミーに完全固定マップ
        function getProductFromBarcode(barcode) {
            // もし事前に設定した内蔵バーコードと完全一致すればそれを返す
            const exactMatch = dummyProducts.find(p => p.barcode === barcode);
            if (exactMatch) return exactMatch;

            // ない場合は、任意のバーコードをハッシュ化して75種の商品へ安定マップ
            let hash = 2166136261;
            for (let i = 0; i < barcode.length; i++) {
                hash ^= barcode.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            const index = Math.abs(hash) % dummyProducts.length;
            return dummyProducts[index];
        }

        // アプリケーション状態
        let cart = []; // カートは再起動時に空からスタート（localStorageは利用しない）
        let html5QrcodeScanner = null;
        let cameras = [];
        let currentCameraIndex = 0;
        
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth < 1024);
        
        let isScannerTransitioning = false;
        let isSolved = false;
        let synth = null;
        let totalAmount = 0, paidAmount = 0, changeAmount = 0;
        let currentFocusIndex = 0;
        let userAnswers = ["", "", "", ""];

        function initAudio() {
            if (!synth) {
                synth = new Tone.Synth({oscillator:{type:"sine"},envelope:{attack:0.005,decay:0.1}}).toDestination();
            }
            if (Tone.context.state !== 'running') Tone.context.resume();
        }

            assignBarcodes();

            setTimeout(() => { initScanner(); }, 300);

        // カメラの検出と起動
        async function initScanner() {
            const container = document.getElementById("camera-fallback-msg");
            container.classList.remove("hidden");
            container.innerHTML = `<span class="text-xl lg:text-3xl mb-1">📷</span><p class="font-bold">カメラを起動しています...</p>`;

            try {
                cameras = await Html5Qrcode.getCameras();
                if (cameras && cameras.length > 0) {
                    let targetIndex = 0;
                    if (isMobile) {
                        const backCamIdx = cameras.findIndex(c => c.label.toLowerCase().includes("back") || c.label.toLowerCase().includes("environment"));
                        if (backCamIdx !== -1) targetIndex = backCamIdx;
                    } else {
                        const frontCamIdx = cameras.findIndex(c => c.label.toLowerCase().includes("front") || c.label.toLowerCase().includes("user"));
                        if (frontCamIdx !== -1) targetIndex = frontCamIdx;
                    }
                    
                    currentCameraIndex = targetIndex;
                    await startScanning(cameras[currentCameraIndex].id);
                } else {
                    throw new Error("利用可能なカメラが見つかりません");
                }
            } catch (err) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center text-center p-2">
                        <p class="font-bold text-rose-400 text-xs">「ぴっ！(テスト用)」ボタンを押してお買い物してね！</p>
                    </div>
                `;
            }
        }

        async function startScanning(cameraId) {
            if (isScannerTransitioning) return;
            isScannerTransitioning = true;
            
            const fallbackMsg = document.getElementById("camera-fallback-msg");

            try {
                if (html5QrcodeScanner) {
                    try { await html5QrcodeScanner.stop(); } catch(e){}
                    try { html5QrcodeScanner.clear(); } catch(e){}
                }
                
                document.getElementById("reader").innerHTML = "";
                html5QrcodeScanner = new Html5Qrcode("reader");

                const config = {
                    fps: 30, // 処理を高速化
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E
                    ],
                    qrbox: function(viewfinderWidth, viewfinderHeight) {
                        return {
                            width: Math.min(viewfinderWidth * 0.85, 420),
                            height: Math.min(viewfinderHeight * 0.5, 140)
                        };
                    },
                    disableFlip: false,
                    videoConstraints: {
                        deviceId: { exact: cameraId },
                        width: { min: 640, ideal: 1280, max: 1920 },
                        height: { min: 480, ideal: 720, max: 1080 },
                        focusMode: "continuous"
                    }
                };

                await html5QrcodeScanner.start(cameraId, config, onScanSuccessInternal, onScanErrorInternal);

                const camera = cameras[currentCameraIndex];
                const isFront = camera && (camera.label.toLowerCase().includes("front") || camera.label.toLowerCase().includes("user"));
                const readerDiv = document.getElementById("reader");
                if (isFront) {
                    readerDiv.classList.add("mirror-video");
                } else {
                    readerDiv.classList.remove("mirror-video");
                }
                
                fallbackMsg.classList.add("hidden");
            } catch (e) {
                fallbackMsg.classList.remove("hidden");
                fallbackMsg.innerHTML = `
                    <div class="flex flex-col items-center justify-center text-center p-2">
                        <p class="font-bold text-rose-400 text-xs">「ぴっ！(テスト用)」ボタンでお買いものしてね！</p>
                    </div>
                `;
            } finally {
                isScannerTransitioning = false;
            }
        }

        // JAN/EANコードのチェックデジット厳格検証
        function isValidBarcode(code) {
            const clean = code.replace(/[^0-9]/g, '');
            if (clean.length !== 8 && clean.length !== 12 && clean.length !== 13) return false;
            
            let sum = 0;
            const len = clean.length;
            const checkDigit = parseInt(clean.charAt(len - 1), 10);
            
            for (let i = len - 2; i >= 0; i--) {
                const digit = parseInt(clean.charAt(i), 10);
                const pos = len - 1 - i;
                sum += digit * (pos % 2 !== 0 ? 3 : 1);
            }
            const calcDigit = (10 - (sum % 10)) % 10;
            return checkDigit === calcDigit;
        }

        // スマホのピントボケによる最初の「誤読(1回目だけ別なものになるエラー)」を完全に防ぐための連続スキャン確認変数
        let lastDetectedBarcode = "";
        let detectedBarcodeCount = 0;
        let lastScanTime = 0;
        let isProcessingScan = false; // 二重読み取り防止

        function onScanSuccessInternal(decodedText) {
            const now = Date.now();
            const cleanCode = decodedText.replace(/[^0-9]/g, ''); 
            
            if (!isValidBarcode(cleanCode)) return; 
            
            // ピントが合っていない時の誤読（1回だけボケて誤検知したコード）を弾く二重確認
            if (cleanCode !== lastDetectedBarcode) {
                lastDetectedBarcode = cleanCode;
                detectedBarcodeCount = 1;
                return; // 2回連続で同じ値が読めるまで確定しない
            } else {
                detectedBarcodeCount++;
                if (detectedBarcodeCount < 2) {
                    return; // 信頼できるピント状態になるまでスキップ
                }
            }
            
            // ロック処理による二重登録の完全阻止 (2.5秒)
            if (isProcessingScan) return;
            if (now - lastScanTime < 2500) return; 
            
            isProcessingScan = true;
            lastScanTime = now;
            
            // 決定論的ハッシュを適用し、同じバーコード＝同一の商品として呼び出し
            const product = getProductFromBarcode(cleanCode);
            if (product) {
                addToCart(product);
            }
            
            setTimeout(() => { isProcessingScan = false; }, 2500);
        }

        function onScanErrorInternal() {}

        async function toggleCameraFacing() {
            if (isScannerTransitioning || cameras.length <= 1) return;
            currentCameraIndex = (currentCameraIndex + 1) % cameras.length;
            await startScanning(cameras[currentCameraIndex].id);
        }

        // テスト用のランダム「ぴっ！」ボタン (同じバーコードなら必ず同じ商品に)
        function triggerMockScan() {
            const now = Date.now();
            if (isProcessingScan) return;
            if (now - lastScanTime < 800) return; 
            
            isProcessingScan = true;
            lastScanTime = now;
            
            // 75種類からランダムに商品を選んで、その商品の一意のバーコードを元に安定スキャンをシミュレート
            const product = dummyProducts[Math.floor(Math.random() * dummyProducts.length)];
            const cleanCode = product.barcode;
            const resolvedProduct = getProductFromBarcode(cleanCode);
            
            addToCart(resolvedProduct);
            
            setTimeout(() => { isProcessingScan = false; }, 800);
        }

        function addToCart(product) {
            initAudio();
            if (synth) synth.triggerAttackRelease("D6", "32n");

            container.classList.add("ring-4", "ring-emerald-400");

            const list = document.getElementById("cart-list");

            if (cart.length === 0) {
                list.innerHTML = `<li id="cart-placeholder" class="text-gray-400 text-center mt-6 sm:mt-12 font-kyokasho text-xs sm:text-sm">おかいもの を はじめよう！</li>`;

        // おつり計算用の出題価格設定
        function getOptimalPayment(total) {
            const base = Math.ceil(total / 1000) * 1000;
            const rand = Math.random();
            if (rand < 0.5) {
                const hasu = total % 100;
                if (hasu > 0 && (base + hasu) > total) return base + hasu;
            }
            return (total < 4000 && Math.random() > 0.6) ? 5000 : (base === total ? base + 1000 : base);
        }

        function renderGrid() {
            const cols = paidAmount >= 10000 ? 6 : 5;

            const ansContainer = document.getElementById("answer-grid-container");
            ansContainer.innerHTML = `<div class="grid grid-cols-${cols} mt-2"><div class="flex items-center justify-center text-lg sm:text-2xl font-black text-slate-400">=</div></div>`;

            for(let i=3; i>=0; i--) ansGrid.innerHTML += `<div onclick="focusDigit(${i})" id="ans-box-${i}" class="m-1 h-10 sm:h-16 bg-amber-50 border-2 border-slate-300 rounded-lg flex items-center justify-center text-xl sm:text-3xl font-black text-amber-700 transition cursor-pointer"></div>`;

        function focusDigit(idx) {
            currentFocusIndex = idx;
            for(let i=0; i<4; i++) {
                const b = document.getElementById(`ans-box-${i}`);
                if(b) b.className = (i===idx) ? "m-1 h-10 sm:h-16 bg-yellow-100 border-4 border-amber-400 rounded-lg flex items-center justify-center text-xl sm:text-3xl font-black text-amber-800 scale-105" : "m-1 h-10 sm:h-16 bg-amber-50 border-2 border-slate-300 rounded-lg flex items-center justify-center text-xl sm:text-3xl font-black text-amber-700";

        function pressKey(k) {
            if (isSolved) return; 
            initAudio();
            if(typeof k === 'number') {
                userAnswers[currentFocusIndex] = k.toString();

                if(currentFocusIndex < 3) focusDigit(currentFocusIndex + 1);
            } else if(k === 'BS') {
                userAnswers[currentFocusIndex] = ""; 
                document.getElementById(`ans-box-${currentFocusIndex}`).innerText = "";
                if(currentFocusIndex > 0) focusDigit(currentFocusIndex - 1);
            } else if(k === 'C') {
                userAnswers = ["","","",""]; 
                for(let i=0; i<4; i++) document.getElementById(`ans-box-${i}`).innerText = "";

            }

        function playCorrectChime() {
            if (synth) {
                const now = Tone.now();
                synth.triggerAttackRelease("C5", "8n", now);
                synth.triggerAttackRelease("E5", "8n", now + 0.1);
                synth.triggerAttackRelease("G5", "8n", now + 0.2);
                synth.triggerAttackRelease("C6", "4n", now + 0.3);
                
                setTimeout(() => {
                    if (synth) {
                        synth.triggerAttackRelease("E6", "8n");
                    }
                }, 400);
            }
        }

        function playIncorrectChime() {
            if (synth) {
                const now = Tone.now();
                synth.triggerAttackRelease("A3", "8n", now);
                synth.triggerAttackRelease("A3", "8n", now + 0.15);
            }
        }

        function checkAnswer() {
            if (isSolved) return;
            let s = ""; 
            for(let i=3; i>=0; i--) s += userAnswers[i] || (s===""?"":"0");
            
            if(parseInt(s || "0") === changeAmount) {
                isSolved = true;
                playCorrectChime();
                startConfetti(); 
                showReceiptButton();

                playIncorrectChime();
            }
        }

        function showAnswerAutomatic() {

            let strIdx = strChange.length - 1;

        let canvas, ctx, isDrawing = false, penColor = '#ef4444';
        function setupMemoCanvas() {
            canvas = document.getElementById("memo-canvas"); 
            if (!canvas) return;
            ctx = canvas.getContext("2d");
            
            const draw = (e) => {
                if(!isDrawing || !ctx) return;
                const r = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
                ctx.lineTo(x, y); 
                ctx.strokeStyle = penColor; 
                ctx.lineWidth = 4; 
                ctx.lineCap = "round"; 
                ctx.stroke();
            };
            
            canvas.onmousedown = (e) => { 
                isDrawing = true; ctx.beginPath(); 
                const r = canvas.getBoundingClientRect(); 
                ctx.moveTo(e.clientX-r.left, e.clientY-r.top); 
            };
            canvas.onmousemove = draw;
            window.onmouseup = () => isDrawing = false;
            
            canvas.addEventListener("touchstart", (e) => { 
                isDrawing = true; ctx.beginPath(); 
                const r = canvas.getBoundingClientRect(); 
                ctx.moveTo(e.touches[0].clientX-r.left, e.touches[0].clientY-r.top); 
                e.preventDefault(); 
            }, { passive: false });
            canvas.addEventListener("touchmove", (e) => { draw(e); e.preventDefault(); }, { passive: false });
            canvas.addEventListener("touchend", () => isDrawing = false);
        }
        
        function resizeCanvas() { 
            const c = document.getElementById("canvas-container"); 
            if (c && canvas && c.offsetWidth > 0) {
                canvas.width = c.offsetWidth; canvas.height = c.offsetHeight; 
            } else setTimeout(resizeCanvas, 50);
        }

        function setPenColor(color) {
            penColor = color;
            document.getElementById("btn-pen-red").className = color === '#ef4444' ? "w-6 h-6 rounded-full bg-red-500 border-2 border-white ring-2 ring-red-500" : "w-6 h-6 rounded-full bg-red-500 border-2 border-white";
            document.getElementById("btn-pen-blue").className = color === '#3b82f6' ? "w-6 h-6 rounded-full bg-blue-500 border-2 border-white ring-2 ring-blue-500" : "w-6 h-6 rounded-full bg-blue-500 border-2 border-white";
            document.getElementById("btn-pen-black").className = color === '#1e293b' ? "w-6 h-6 rounded-full bg-slate-800 border-2 border-white ring-2 ring-slate-800" : "w-6 h-6 rounded-full bg-slate-800 border-2 border-white";
        }

        function clearCanvas() { if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height); }

        let confettiCanvas, confettiCtx, confettiAnimationId = null;
        const confettis = [];
        const confettiColors = ['#f43f5e', '#3b82f6', '#10b981', '#eab308', '#a855f7', '#ff7849', '#ffc82c'];

        function startConfetti() {
            confettiCanvas = document.getElementById("confetti-canvas");
            confettiCtx = confettiCanvas.getContext("2d");
            confettiCanvas.classList.remove("hidden");
            
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
            
            confettis.length = 0;
            for (let i = 0; i < 120; i++) {
                confettis.push({
                    x: Math.random() * confettiCanvas.width,
                    y: Math.random() * -confettiCanvas.height - 20,
                    size: Math.random() * 8 + 6,
                    color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
                    speedX: Math.random() * 4 - 2,
                    speedY: Math.random() * 5 + 4,
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 4 - 2
                });
            }
            
            if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
            animateConfetti();
        }

        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            let active = false;
            
            confettis.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX + Math.sin(p.y / 30) * 0.5;
                p.rotation += p.rotationSpeed;
                
                if (p.y < confettiCanvas.height) {
                    active = true;
                }
                
                confettiCtx.save();
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rotation * Math.PI / 180);
                confettiCtx.fillStyle = p.color;
                confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                confettiCtx.restore();
            });
            
            if (active) {
                confettiAnimationId = requestAnimationFrame(animateConfetti);
            } else {
                stopConfetti();
            }
        }

        function stopConfetti() {
            if (confettiAnimationId) {
                cancelAnimationFrame(confettiAnimationId);
                confettiAnimationId = null;
            }
            if (confettiCanvas) {
                confettiCanvas.classList.add("hidden");
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            }
        }

        window.addEventListener("resize", () => {
            if (confettiCanvas && !confettiCanvas.classList.contains("hidden")) {
                confettiCanvas.width = window.innerWidth;
                confettiCanvas.height = window.innerHeight;
            }
        });
    </script>
